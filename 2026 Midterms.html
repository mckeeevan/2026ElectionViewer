  <script id="3" type="module" pinned="">
    // ───────────── VIZ: assemble the app from the modules above ─────────────
    const viz = (() => {
      const app = createApp();
      startApp(app);
      invalidation.then(() => stopApp(app));
      return Object.assign(app.root, {
        app,
        setScope: (scope, mode) => navigate(app, scope, mode),
        setMode: (mode) => switchMode(app, mode),
        setView: (view) => switchView(app, view)
      });
    })();
    display(viz);
  </script>
  <script id="80" type="module" pinned="">
    // ───────────── SIM VIEWER: histogram of the 10000 simulated outcomes + which one is on the map ─────────────
    // Attaches under the map (additive: the map, board and strip are unchanged). Picking a simulation rewrites every row's share (setSim)
    // and repaints with a short color transition. Follows the Senate / Governor / House toggle through app.onRender.
    const simPanel = (() => {
      const app = viz.app, K = SIM_OUT.K, meta = SIM_OUT.meta, draws = meta.national.draws;
      const MAJ = { senate: 51, governor: 26, house: 218 };
      const W = 975, H = 170, M = { t: 22, r: 12, b: 26, l: 12 };
      const totals = {}, order = {};
      for (const k of MODE_KEYS) {
        const w = meta.modes[k].wins, base = NOT_UP[k].D + (k === "senate" ? NOT_UP[k].I : 0);
        // D-side seat total = non-up D incumbents + D up-race wins + independent
        // up-race wins (independent senators caucus with D). Matches the
        // ELECTION NIGHT cards' seatTotal.
        totals[k] = Array.from({ length: K + 1 }, (_, i) => base + w.D[i] + (k === "senate" ? w.I[i] : 0));
        order[k] = d3.range(K).sort((a, b) => totals[k][a] - totals[k][b] || draws[a] - draws[b]);
      }
      const slice = (k, a, b) => order[k].slice(Math.round(K * a), Math.round(K * b));
      const GROUPS = [
        { key: "avg", label: "Average" },
        { key: "bot", label: "Bottom 10%", sub: "best for R", a: 0, b: 0.1 },
        { key: "med", label: "Median", sub: "middle 10%", a: 0.45, b: 0.55 },
        { key: "top", label: "Top 10%", sub: "best for D", a: 0.9, b: 1 }
      ];
      const st = { group: "avg", pos: 0, mode: null };

      const root = html`<div class="simpanel" style="margin-top:14px; font-size:13px;">
        <div class="sp-head" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;"></div>
        <div class="sp-line" style="margin:8px 0 2px; color:#475569;"></div>
        <svg class="sp-svg" viewBox="0 0 ${W} ${H}" style="width:100%; display:block;"></svg>
      </div>`;
      const head = d3.select(root.querySelector(".sp-head"));
      const svg = d3.select(root.querySelector(".sp-svg"));
      const line = root.querySelector(".sp-line");
      const pill = (sel) => sel.style("padding", "3px 12px").style("border", "1px solid #64748b").style("border-radius", "5px").style("cursor", "pointer").style("font-size", "12px");
      const MODEL_CMD = "Rscript model/run_all.R --refetch";

      head.append("span").text("Simulation").style("font-weight", 600).style("margin-right", "6px");
      const gBtns = head.selectAll("button.g").data(GROUPS).join("button").attr("class", "g").call(pill)
        .text((d) => d.label).attr("title", (d) => d.sub || "mean of all 1000 runs")
        .on("click", (e, d) => pickGroup(d.key));
      const extremes = [{ key: "bestD", label: "Best for D" }, { key: "bestR", label: "Best for R" }];
      const eBtns = head.selectAll("button.e").data(extremes).join("button").attr("class", "e").call(pill)
        .text((d) => d.label).attr("title", (d) => (d.key === "bestD" ? "Jump to the most Democratic outcome" : "Jump to the most Republican outcome"))
        .on("click", (e, d) => pickExtreme(d.key));
      const prev = head.append("button").call(pill).text("◀").on("click", () => step(-1));
      const next = head.append("button").call(pill).text("▶").on("click", () => step(1));
      const rerun = head.append("button").call(pill).text("↻ Rerun model").attr("title", "Copy rerun command for the terminal").on("click", requestModelRerun);
      const memberOf = (k = state().mode) => (st.group === "avg" ? [K] : slice(k, GROUPS.find((g) => g.key === st.group).a, GROUPS.find((g) => g.key === st.group).b));
      const state = () => app.state;

      async function requestModelRerun() {
        const msg = `Run this in your terminal from the project root:\n${MODEL_CMD}\n\nThen reload this page.`;
        try {
          await navigator.clipboard.writeText(MODEL_CMD);
          hint(`Model rerun command copied: ${MODEL_CMD}`);
        } catch (err) {
          hint(`Model rerun command: ${MODEL_CMD}`);
        }
        alert(msg);
      }

      function go(idx) {
        setSim(idx);
        renderApp(app, 500);
        paint();
      }
      function pickGroup(key) {
        st.group = key;
        const m = memberOf();
        st.pos = key === "avg" ? 0 : Math.floor(m.length / 2);
        go(m[st.pos]);
      }
      function step(d) {
        if (st.group === "avg") return pickGroup("med");
        const m = memberOf();
        st.pos = (st.pos + d + m.length) % m.length;
        go(m[st.pos]);
      }
      function pickBin(seats) {
        const k = state().mode, hits = order[k].filter((i) => totals[k][i] === seats);
        if (!hits.length) return;
        st.group = "pick";
        st.pos = 0;
        go(hits[Math.floor(hits.length / 2)]);
      }
      function pickExtreme(key) {
        const k = state().mode;
        const idx = key === "bestD" ? order[k][order[k].length - 1] : order[k][0];
        st.group = "pick";
        st.pos = 0;
        go(idx);
      }

      const gAxis = svg.append("g"), gBars = svg.append("g"), gMark = svg.append("g").attr("pointer-events", "none");
      let x = null, y = null;

      function draw(animate) {
        const k = state().mode, tot = totals[k], maj = MAJ[k];
        const counts = d3.rollup(d3.range(K), (v) => v.length, (i) => tot[i]);
        const [lo, hi] = d3.extent(counts.keys());
        const dom = d3.range(Math.max(0, Math.min(lo, maj) - 2), Math.min(SEAT_TOTAL[k], Math.max(hi, maj) + 2) + 1);
        x = d3.scaleBand(dom, [M.l, W - M.r]).paddingInner(0.08);
        y = d3.scaleLinear([0, d3.max(counts.values())], [H - M.b, M.t]);
        const t = animate ? svg.transition().duration(500) : svg.transition().duration(0);
        const pc = (s) => (s >= maj ? THEME.D_COL || "#2563eb" : THEME.R_COL || "#dc2626");
        gBars.selectAll("rect").data(dom.filter((s) => counts.has(s)), (s) => s).join(
          (e) => e.append("rect").attr("x", (s) => x(s)).attr("width", x.bandwidth()).attr("y", y(0)).attr("height", 0).attr("fill", pc)
            .style("cursor", "pointer").on("click", (ev, s) => pickBin(s))
            .on("mouseenter", (ev, s) => hint(`${s} seats · ${counts.get(s)} of ${K} sims`)).on("mouseleave", () => hint(null))
            .call((e2) => e2.append("title")),
          (u) => u, (x2) => x2.transition(t).attr("y", y(0)).attr("height", 0).remove()
        ).call((s) => s.transition(t).attr("x", (d) => x(d)).attr("width", x.bandwidth()).attr("y", (d) => y(counts.get(d))).attr("height", (d) => y(0) - y(counts.get(d))).attr("fill", pc));
        gAxis.call((g) => {
          g.selectAll("*").remove();
          const ticks = dom.filter((s) => (dom.length > 30 ? s % 5 === 0 : s % 2 === 0));
          g.selectAll("text").data(ticks).join("text").attr("x", (s) => x(s) + x.bandwidth() / 2).attr("y", H - 8).attr("text-anchor", "middle")
            .attr("font-size", 11).attr("fill", "#64748b").text((s) => s);
          const mx = x(maj) - (x.step() - x.bandwidth()) / 2;
          g.append("line").attr("x1", mx).attr("x2", mx).attr("y1", M.t - 8).attr("y2", H - M.b).attr("stroke", "#111").attr("stroke-dasharray", "3 3");
          g.append("text").attr("x", mx).attr("y", M.t - 11).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", "#111").text(`${maj} to win`);
        });
        paint();
      }

      function hint(s) { root.__hint = s; line.innerHTML = s ? s : root.__txt || ""; }

      function paint() {
        const k = state().mode, tot = totals[k], idx = SIM.index, maj = MAJ[k];
        const pDem = tot.slice(0, K).filter((v) => v >= maj).length / K;
        const q = (p) => d3.quantile(tot.slice(0, K).sort(d3.ascending), p);
        const who = idx === K ? "Average of all simulations" : `Simulation ${idx + 1} of ${K}`;
        const lab = MODES[k].label;
        root.__txt = `${who}: D side ${tot[idx]} / R side ${SEAT_TOTAL[k] - tot[idx]} · ${d3.format(".0%")(pDem)} of runs give D the ${lab.toLowerCase()} (median ${q(0.5)}, 80% range ${q(0.1)}–${q(0.9)})`;
        if (!root.__hint) line.textContent = root.__txt;
        gBtns.style("background", (d) => (d.key === st.group ? "#222" : "#fff")).style("color", (d) => (d.key === st.group ? "#fff" : "#222"));
        gMark.selectAll("*").remove();
        if (!x) return;
        const cx = (v) => x(Math.round(v)) + x.bandwidth() / 2;
        const mean = d3.mean(tot.slice(0, K));
        if (x(Math.round(mean)) != null) gMark.append("text").attr("x", cx(mean)).attr("y", M.t + 8).attr("text-anchor", "middle").attr("font-size", 10).attr("fill", "#475569").text("mean");
        if (x(tot[idx]) != null) gMark.append("path").attr("d", d3.symbol(d3.symbolTriangle, 70)()).attr("transform", `translate(${cx(tot[idx])},${y(0) + 10}) rotate(0)`).attr("fill", "#111");
        gBars.selectAll("rect").attr("opacity", (s) => {
          if (st.group === "avg") return Math.abs(s - mean) <= 1 ? 1 : 0.55;
          return s === tot[idx] ? 1 : 0.55;
        });
      }

      // Chain onto any existing onRender (e.g. the Election Night panel) instead of
      // overwriting it, so later cells' hooks keep firing.
      const prevSimRender = app.onRender;
      app.onRender = () => { prevSimRender?.(); if (st.mode !== state().mode) { const first = st.mode === null; st.mode = state().mode; if (st.group !== "avg" && st.group !== "pick") st.pos = Math.floor(memberOf().length / 2); draw(!first); } };
      app.onRender();
      return root;
    })();
    viz.querySelectorAll(".simpanel").forEach((e) => e !== simPanel && e.remove());
    viz.append(simPanel);
    // On invalidation just drop the panel; leave app.onRender alone so the
    // Election Night panel's syncToTime hook (chained on top) keeps working.
    invalidation.then(() => { simPanel.remove(); });
  </script>
  <script id="81" type="module" pinned="">
    // ───────────── ELECTION NIGHT: live posterior gauge + outcome cards ─────────────
    // As counties report, each of the 10,000 simulations is a full-outcome hypothesis.
    // We re-weight sims by how well they match the reported counties (posterior
    // resampling), then read off the win probability (gauge) and re-rank a fixed
    // diverse set of outcome cards by their posterior likelihood.
    (function () {
      const app = viz.app, K = SIM_OUT.K, meta = SIM_OUT.meta, scale = SIM_OUT.scale;
      const MAJ = { senate: 51, governor: 26, house: 218 };
      let SIGMA = 0.04; // honest per-county observation noise (measured sim-to-sim sd ≈ 0.041)
      // Two-level county correlation, measured from the sim bins (seed 7, ~90 units/mode,
      // 4000 sims). Counties share a national shock (ρ_b) and, within a state, an extra
      // state shock (ρ_w − ρ_b). Senate/Governor counties share the state shock almost
      // perfectly (ρ_w≈0.97); House districts are more granular (ρ_w≈0.28).
      const RHO = {
        house: { w: 0.283, b: 0.198 },
        senate: { w: 0.967, b: 0.204 },
        governor: { w: 0.968, b: 0.234 },
      };
      // State-call tolerance: a sim is hard-eliminated only if it disagrees with
      // called states by MORE than this many seats (House) / states (Senate/Gov).
      // Senate/Gov are 1-seat-per-state, so 0 = strict "called means called".
      // House has 435 districts across 50 states — a strict call would collapse the
      // posterior to a single seat count, so we allow a sim to be wrong on a bounded
      // number of called states' worth of seats and keep the posterior spread honest.
      const CALL_TOL = { house: 20, senate: 0, governor: 0 };
      const N_CARDS = 100;

      // Deterministic per-(mode, sim, county) Gaussian noise. The demo feeds the
      // selected "reality" sim's county values as observations; without noise the
      // reality sim matches perfectly and the posterior collapses to a single sim
      // (seat range "219–219"). Seeded noise keeps the posterior broad early and
      // narrowing realistically as counties accumulate, and is reproducible when
      // scrubbing the time bar.
      function countyNoise(key, simIdx, countyIdx) {
        let h = 2166136261;
        const mix = (x) => { h ^= x; h = Math.imul(h, 16777619); };
        mix(key.charCodeAt(0) * 73856093); mix(simIdx); mix(countyIdx);
        let a = h >>> 0;
        const rand = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const u = Math.max(rand(), 1e-9), v = rand();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      }

      // ── per-mode posterior state ──
      const P = {};
      MODE_KEYS.forEach((key) => {
        const m = meta.modes[key];
        const nU = m.units.length;
        const votes = m.units.map((u) => u.votes);
        const stateOf = m.units.map((u) => u.state);
        const byState = new Map();
        m.units.forEach((u, i) => { const a = byState.get(u.state) || []; a.push(i); byState.set(u.state, a); });
        const wins = m.wins.D;
        const winsI = m.wins.I;
        const notUpD = NOT_UP[key].D + (key === "senate" ? NOT_UP[key].I : 0);
        const seatTotal = new Float64Array(K);
        // Senate independent up-race wins caucus with D, so fold them into the D-side total.
        for (let k = 0; k < K; k++) seatTotal[k] = notUpD + wins[k] + (key === "senate" ? winsI[k] : 0);
        // diverse set: N_CARDS seat bands across the seat-total range. Each band
        // holds the single most-likely sim in that seat range; update() swaps in
        // a new sim as the night progresses, so the cards track the posterior
        // while still showing a variety of outcomes.
        const order = Array.from({ length: K }, (_, k) => k).sort((a, b) => seatTotal[a] - seatTotal[b]);
        const strata = [];
        for (let c = 0; c < N_CARDS; c++) {
          strata.push([Math.floor((c * K) / N_CARDS), Math.floor(((c + 1) * K) / N_CARDS)]);
        }
        const cards = [];
        for (let c = 0; c < N_CARDS; c++) {
          const k = order[strata[c][0]];
          const d = wins[k], r = m.wins.R[k], i = m.wins.I[k];
          cards.push({ k, d, r, i, total: seatTotal[k], logW: 0, w: 1 });
        }
        const cardOrder = cards.map((c) => c.k); // original stratified order
        const prior = seatTotal.filter((t) => t >= MAJ[key]).length / K;
        // prior seat quantiles (uniform weights) for the initial uncertainty readout
        const sorted = Array.from(seatTotal).sort((a, b) => a - b);
        const q = (f) => sorted[Math.min(K - 1, Math.floor(f * K))];
        // Precompute each sim's state winner (D=1, R=0) so a called state can
        // hard-eliminate every sim where that state went the other way, cheaply.
        const states = [...byState.keys()];
        const stateIdx = new Map(states.map((s, i) => [s, i]));
        const nStates = states.length;
        const stateUnits = states.map((st) => byState.get(st));
        const stateDenom = stateUnits.map((idxs) => idxs.reduce((s, i) => s + votes[i], 0));
        const simStateParty = new Uint8Array(K * nStates);
        const bins = SIM_OUT.bins[key];
        for (let k = 0; k < K; k++) {
          for (let si = 0; si < nStates; si++) {
            const idxs = stateUnits[si];
            let num = 0;
            for (const i of idxs) num += (bins[k * nU + i] / scale) * votes[i];
            simStateParty[k * nStates + si] = num / stateDenom[si] >= 0.5 ? 1 : 0;
          }
        }
        P[key] = { m, nU, votes, stateOf, byState, wins, notUpD, seatTotal, cards, cardOrder, strata, order, logW: new Float64Array(K), rawL: new Float64Array(K), elim: new Uint8Array(K), reported: new Uint8Array(nU), obs: new Float64Array(nU), maxL: 0, sumW: K, gauge: prior, prior, nEff: K, seatLo: q(0.25), seatMed: q(0.5), seatHi: q(0.75), states, stateIdx, nStates, simStateParty, stateDenom, nObs: 0, stateCounts: new Map() };
      });

      // ── posterior update for one mode (incremental: O(K) per new county) ──
      function update(key) {
        const p = P[key];
        const logW = p.logW;
        // The gauge, uncertainty, and seat range reflect the FULL 10k posterior
        // (accurate). The cards are a diverse sample that swaps in the most
        // likely sim per seat band, so they track the posterior while showing a
        // variety of outcomes.
        // ── Two-level ESS correlation discount ──
        // Reported counties are NOT independent. Model each county's deviation as
        //   x_i = a_state + b_national + e_i
        // with a shared national shock (var ρ_b) and, within a state, an extra
        // state shock (var ρ_w − ρ_b); county-specific var is 1 − ρ_w. The
        // information for the mean is n_eff = 1ᵀΣ⁻¹1, which (by symmetry) has the
        // closed form, over states s with n_s reported counties:
        //   A = Σ_s n_s / ((ρ_w−ρ_b)·n_s + (1−ρ_w))
        //   n_eff = A / (1 + ρ_b·A)
        // This reduces exactly to N/(1+(N−1)ρ) when ρ_w = ρ_b = ρ. Crucially it
        // is per-state: reporting many counties in ONE state adds little (they
        // share the state shock), while the same number spread across states adds
        // much more. Treating counties as independent (the old behavior)
        // over-counts the shared signal and collapses the posterior to ~100%
        // certainty far too early. We scale the raw log-likelihood by n_eff/N.
        const nObs = p.nObs;
        let discount = 0;
        if (nObs > 0) {
          const { w: rhoW, b: rhoB } = RHO[key];
          const sigA2 = Math.max(rhoW - rhoB, 1e-9); // state shock var
          const sigB2 = Math.max(1 - rhoW, 1e-9);    // county-specific var
          let A = 0;
          for (const ns of p.stateCounts.values()) {
            A += ns / (sigA2 * ns + sigB2);
          }
          const nEff = A / (1 + rhoB * A);
          discount = nEff / nObs;
        }
        for (let k = 0; k < K; k++) {
          logW[k] = p.elim[k] ? -Infinity : p.rawL[k] * discount;
        }
        // log-sum-exp over all K sims for stability
        let maxL = -Infinity;
        for (let k = 0; k < K; k++) if (logW[k] > maxL) maxL = logW[k];
        p.maxL = maxL;
        let sumW = 0, gaugeNum = 0, sumW2 = 0;
        for (let k = 0; k < K; k++) {
          const w = Math.exp(logW[k] - maxL);
          sumW += w;
          sumW2 += w * w;
          if (p.seatTotal[k] >= MAJ[key]) gaugeNum += w;
        }
        p.sumW = sumW;
        p.gauge = sumW > 0 ? gaugeNum / sumW : p.prior;
        // Effective sample size of the weighted posterior (for a win-prob CI).
        p.nEff = sumW > 0 ? (sumW * sumW) / Math.max(sumW2, 1e-9) : 1;
        // Weighted 25/50/75th percentile of seat totals (via a small histogram).
        let sMin = Infinity, sMax = -Infinity;
        for (let k = 0; k < K; k++) { const s = p.seatTotal[k]; if (s < sMin) sMin = s; if (s > sMax) sMax = s; }
        const hist = new Float64Array(sMax - sMin + 1);
        for (let k = 0; k < K; k++) hist[p.seatTotal[k] - sMin] += Math.exp(logW[k] - maxL);
        const wq = (frac) => { let acc = 0; for (let i = 0; i < hist.length; i++) { acc += hist[i]; if (acc >= frac * sumW) return sMin + i; } return sMax; };
        p.seatLo = wq(0.25); p.seatMed = wq(0.5); p.seatHi = wq(0.75);
        // ── re-stratify the cards over the surviving sims ──
        // The original seat bands were cut from the prior (all K sims). As the
        // night progresses the posterior concentrates, so those fixed bands go
        // stale. Re-form the cards over the sims that are still alive (weight >
        // 0, excluding the hidden reality sim): when there are more survivors
        // than cards, split them into seat-total bands and pick the top sim per
        // band (keeps the cards diverse across outcomes); when there are few
        // survivors, show each one ranked by weight. This lets the cards swap
        // in new outcomes as states get called, tracking the current posterior.
        const wins = p.wins, m = p.m;
        const aliveK = [];
        for (let k = 0; k < K; k++) {
          if (k === SIM.index || p.elim[k]) continue;
          aliveK.push(k);
        }
        const nAlive = aliveK.length, nBands = p.cards.length;
        const assign = (c, k) => {
          const cd = p.cards[c];
          cd.k = k;
          cd.d = wins[k]; cd.r = m.wins.R[k]; cd.i = m.wins.I[k];
          cd.total = p.seatTotal[k];
          cd.w = Math.exp(logW[k] - maxL);
        };
        if (nAlive <= nBands) {
          aliveK.sort((a, b) => Math.exp(logW[b] - maxL) - Math.exp(logW[a] - maxL));
          for (let c = 0; c < nBands; c++) {
            if (c < nAlive) assign(c, aliveK[c]);
            else p.cards[c].w = 0;
          }
        } else {
          aliveK.sort((a, b) => p.seatTotal[a] - p.seatTotal[b]);
          for (let c = 0; c < nBands; c++) {
            const lo = Math.floor((c * nAlive) / nBands);
            const hi = Math.floor(((c + 1) * nAlive) / nBands);
            let bestK = -1, bestW = -1;
            for (let j = lo; j < hi; j++) {
              const k = aliveK[j];
              const w = Math.exp(logW[k] - maxL);
              if (w > bestW) { bestW = w; bestK = k; }
            }
            if (bestK >= 0) assign(c, bestK);
            else p.cards[c].w = 0;
          }
        }
        // re-rank cards by posterior weight
        p.cards.sort((a, b) => b.w - a.w);
      }

      // ── ingest a reported county: { mode, state, county, dem } ──
      // Core likelihood update (no render) — shared by live results and the
      // time-bar-driven demo.
      function reportRaw(mode, state, county, dem) {
        const p = P[mode];
        const idxs = p.byState.get(state);
        if (!idxs) return;
        const idx = idxs.find((i) => p.m.units[i].id === county);
        if (idx == null || p.reported[idx]) return;
        p.reported[idx] = 1;
        p.obs[idx] = dem;

        const sig = [key, showAll, nRep, Math.round(leadProb * 1000), p.seatLo, p.seatMed, p.seatHi,
          shown.map((cd) => cd.k + ":" + Math.round((cardSum > 0 ? cd.w / cardSum : 0) * 1000)).join(",")].join("|");

      // ── demo: the selected sim is "reality"; the time bar drives the night ──
      // "Play the night" rewinds the time bar to 0 and plays it forward; the
      // onRender hook (syncToTime) reports each county as its schedule completes.
      function resetMode(key) {

      const prevRender = app.onRender;

    // Pure function of the counted vote, shared by fills, the map overlay, and the tooltip.

     * A race is called when the leader's lead is bigger than what the uncounted votes could plausibly swing
     * (they'd have to break ~60/40), after at least 20% is in and with a lead of at least half a point.
     * `contest` is accepted for future use (e.g. AP-style rules per race); only the tally `a` is used today.
     * Returns the winning party ("D" | "R" | "I") or null.
     */
    function callFor(contest, a) {
      const counted = a.dem + a.rep + a.ind;
      if (counted <= 0 || !(a.total > 0)) return null;
      const remaining = Math.max(0, a.total - counted);
      const remainingRatio = a.total > 0 ? remaining / a.total : 0;
      const r = [{ p: "D", v: a.dem }, { p: "R", v: a.rep }, { p: "I", v: a.ind }].sort((x, y) => y.v - x.v);
      const lead = r[0].v - r[1].v;
      const leadPct = lead / counted;
      if (a.reported < 0.2) return null;
      if (remainingRatio > 0.2 && leadPct < 0.08) return null;

      return lead > swingLimit && leadPct >= 0.005 ? r[0].p : null;

        const [po, year, margin, dem, rep] = r.split("|");
        return [incumbents.FIPS[po], { m: +margin / 100, year: +year, dem, rep }];
      }));
      return m.get(fips) ?? null;

      const fips = String(sid).padStart(2, "0");
      if (mode === "governor") {
        const lastGov = lastGovernorFallback(fips);
        if (lastGov) return lastGov.m >= 0 ? "D" : "R";

      const incParty = inc?.caucus || inc?.party;

    // ── 3. THE MODEL RUNS IN R ──
    // model/01_fit.R fits the regressions (national, Senate, House district ↔ county ↔ state, county swing); model/02_simulate.R then draws

      // (parallel *_ind.bin, read in setSim) — no HTML heuristic here.
      contests.forEach((c) => (c.pt = geoPath.centroid(c.feature)));

    const MODEL = Object.fromEntries(MODE_KEYS.map((k) => [k, buildModel(k)]));

    const SIM = { index: SIM_OUT.K, K: SIM_OUT.K };

    function tallyByCaucus(list) {
      return {
        D: list.filter((p) => p.caucus === "D").length,
        R: list.filter((p) => p.caucus === "R").length,

    }

    const NOT_UP = {
      senate: {
        D: incumbents.senators.filter((p) => !p.up && p.caucus === "D").length,
        R: incumbents.senators.filter((p) => !p.up && p.caucus === "R").length,
        // King & Sanders caucus "I" but the model's 35 up-races already account for the
        // independent seats; counting them again here double-counts (+2). Force 0.
        I: 0
      },
      governor: {
        ...tallyByCaucus([...incumbents.governor.values()].filter((g) => !g.up)),
        I: 0
      },
      house: { D: 0, R: 0, I: 0 }
    };
    const SEAT_TOTAL = { senate: 100, governor: 50, house: MODEL.house.contests.length };
    const CONTROL_TITLE = { senate: "SENATE CONTROL", governor: "GOVERNORSHIPS", house: "HOUSE CONTROL" };

    function reportedFraction(sim, T) {
      return _reportedFraction(sim, T);
    }

    function aggregate(list, T) {
      const a = _aggregate(list, T);
      return { dem: a.dem, rep: a.rep, ind: a.ind, total: a.total, reported: a.total > 0 ? a.counted / a.total : 0 };

    function raceStatus(contest, a) {
      const counted = a.dem + a.rep + a.ind;
      if (a.reported < 0.02 || counted <= 0) return null;

      const cands = [
        { party: "D", votes: a.dem },
        { party: "R", votes: a.rep },
        { party: "I", votes: a.ind }
      ].sort((x, y) => y.votes - x.votes);

      const top1 = cands[0];
      const top2 = cands[1];
      const leader = top1.party;
      const leadMargin = (top1.votes - top2.votes) / counted;
      const outstanding = Math.max(0, a.total - counted);
      const outstandingRatio = a.total > 0 ? outstanding / a.total : 0;

      // Signed margin: Negative for Republican leads, Positive for Dem/Ind leads
      const m = leader === "R" ? -leadMargin : leadMargin;
      const wantsFlip = leader !== contest.base;
      const enoughData = a.reported >= 0.08 || (a.reported >= 0.05 && leadMargin >= 0.02);
      const enoughEdge = leadMargin >= 0.01;

      if (wantsFlip && enoughData && enoughEdge && !(outstandingRatio > 0.2 && leadMargin < 0.08)) {
        return { kind: "flip", to: leader, m, leaderParty: leader };
      }
      // A race that has been called (per callFor) but hasn't flipped: show as "called"
      const called = callFor(contest, a);
      if (called) {
        return { kind: "called", to: called, m, leaderParty: called };
      }
      if (leadMargin < 0.05) {
        return { kind: "close", to: leader, m, leaderParty: leader };
      }
      return null;
    }

    /** Everything the UI needs to know at this moment. Pure: (mode, scope, T) → numbers. */
    function summarize(state) {
      const { mode, scope, T } = state, data = MODEL[mode];
      const statusMap = new Map(), all = [], inScope = [], waiting = [];
      const counts = { ld: 0, lr: 0, li: 0, fd: 0, fr: 0, fi: 0, close: 0, nd: 0, nr: 0, ni: 0 };

      for (const c of data.contests) {
        const a = aggregate(c.rows, T), s = raceStatus(c, a);
        const counted = a.dem + a.rep + a.ind;

        if (s) {
          const rec = { ...s, c, pt: c.pt, key: `${c.id}:${s.kind}:${s.to}` };
          statusMap.set(c.id, rec);
          all.push(rec);
        }

        let leader = null;
        let m = 0;

        if (counted > 0) {
          const cands = [
            { party: "D", votes: a.dem },
            { party: "R", votes: a.rep },
            { party: "I", votes: a.ind }
          ].sort((x, y) => y.votes - x.votes);

          leader = cands[0].party;
          const leadMargin = (cands[0].votes - cands[1].votes) / counted;
          m = leader === "R" ? -leadMargin : leadMargin;
        }

        if (scope && c.state === scope) {
          if (counted > 0) {
            inScope.push({ c, m, kind: s ? s.kind : "hold", to: s ? s.to : leader });
          } else {
            waiting.push(mode === "house" ? districtLabel(c.feature) : stateName(c.id));
          }
        }

        if (leader === "D") counts.nd++;
        else if (leader === "R") counts.nr++;
        else if (leader === "I") counts.ni++;

        if (!scope || c.state === scope) {
          if (leader === "D") counts.ld++;
          else if (leader === "R") counts.lr++;
          else if (leader === "I") counts.li++;

          if (s) {
            if (s.kind === "close") counts.close++;
            else if (s.kind === "flip") {
              if (s.to === "D") counts.fd++;
              else if (s.to === "R") counts.fr++;
              else if (s.to === "I") counts.fi++;
            }
          }
        }
      }

      const inView = scope ? data.contests.filter((c) => c.state === scope).length : data.contests.length;
      const votes = aggregate(scope ? data.byState.get(scope) : data.sims, T);
      return { data, statusMap, all, inScope, waiting, counts, inView, votes };
    }

    // screen-space (y grows downward), so we build the SVG path directly from the raw coordinates — no d3-geo.
    const ABBR_BY_FIPS = Object.fromEntries(Object.entries(incumbents.FIPS).map(([abbr, fips]) => [fips, abbr]));
    /** SVG path for a tile's rings (screen-space, y-down). MultiPolygon tiles (e.g. HI) get one subpath per ring. */
    function tilePath(rings) {
      let s = "";
      for (const ring of rings) {
        for (let i = 0; i < ring.length; i++) s += `${i ? "L" : "M"}${ring[i][0]},${ring[i][1]}`;
        s += "Z";
      }
      return s;
    }
    /** The Guardian's label point for a state (where its postal code sits), keyed by FIPS. */
    const tilesLabel = new Map();
    if (houseTiles) for (const l of houseTiles.labels) tilesLabel.set(incumbents.FIPS[l.abbr], [l.x, l.y]);
    const tilesLabelPoint = (fips) => tilesLabel.get(fips) || null;
    const tilesUnitCache = {};
    function tilesUnits() {
      if (tilesUnitCache.district) return tilesUnitCache.district;
      if (!houseTiles) return (tilesUnitCache.district = []);
      const byCode = new Map(houseTiles.tiles.map((t) => [t.code, t]));
      const out = [];
      for (const f of geoDistricts) {
        const fips = stateOf(f), abbr = ABBR_BY_FIPS[fips];
        // Census uses district "00" for single-member states; the cartogram codes them "01".
        let dn = +f.id.slice(2); if (dn === 0) dn = 1;
        const code = abbr + String(dn).padStart(2, "0");
        const tile = byCode.get(code);
        if (!tile) continue;
        const d = tilePath(tile.rings);
        // centroid + radius for labels / hit-testing: mean of all points, r = farthest point from the centroid.
        let sx = 0, sy = 0, n = 0;
        for (const ring of tile.rings) for (const [x, y] of ring) { sx += x; sy += y; n++; }
        const cx = sx / n, cy = sy / n;
        let r = 0;
        for (const ring of tile.rings) for (const [x, y] of ring) r = Math.max(r, Math.hypot(x - cx, y - cy));

      }

    // ---- vote circles / cartogram ----
    /** Push overlapping circles apart (keeping them near where they belong) and inside the map. */
    function relaxCircles(nodes, gap) {

        .force("x", d3.forceX((d) => d.tx).strength(0.08))
        .force("y", d3.forceY((d) => d.ty).strength(0.08))
        .force("hit", d3.forceCollide((d) => d.r + gap).iterations(3))
        .tick(250);
      for (const n of nodes) { n.x = clamp(n.x, n.r, THEME.W - n.r); n.y = clamp(n.y, n.r, THEME.H - n.r); }
    }
    const bubbleCache = new Map();
    /** grain "fine": a circle per county (Senate/Governor) or district (House). grain "race": a circle per race (state / district). */
    function bubbleUnits(mode, grain) {
      const key = `${mode}:${grain}`;
      if (bubbleCache.has(key)) return bubbleCache.get(key);
      const data = MODEL[mode], segs = (r) => (r < 2 ? 12 : r < 6 ? 20 : 36);
      let out;
      if (mode === "house") {
        const k = grain === "race" ? 0.016 : 0.0115, tag = grain === "race" ? "cart" : "bub";

        });

        out = nodes.map((n) => makeViewUnit(tag, "district", n.f.id, stateOf(n.f), n.f, circlePath({ cx: n.x, cy: n.y, r: n.r }, segs(n.r)), { cx: n.x, cy: n.y, r: n.r }, { bubble: true }));
      } else if (grain === "fine") {
        out = [];
        for (const sid of MODES[mode].states) {
          for (const f of countiesByState.get(sid) || []) {

    }

    /** Which units are on screen for a given mode + scope + view. */
    function unitsFor(mode, scope, view = "map") {
      const ev = effectiveView(view, scope, mode);
      if (ev === "map") {
        if (mode === "house") return districtUnits;
        return [...stateUnits.filter((u) => u.id !== scope), ...(scope ? countyUnitsOf(scope) : [])];
      }
      if (ev === "hex") return hexUnits(mode === "house" ? "district" : "state");
      if (ev === "tiles") return tilesUnits();
      const grain = ev === "cartogram" ? "race" : "fine";
      if (mode === "house") return bubbleUnits("house", grain);
      const race = MODES[mode].states;
      return [...stateUnits.filter((u) => !race.has(u.id)), ...bubbleUnits(mode, grain)];
    }

    // ---- where a contest's shape is in the current view (for overlays, flashes, the spotlight) ----
    const unitIndexCache = new WeakMap();
    const unitIndex = (units) => {
      let m = unitIndexCache.get(units);
      if (!m) unitIndexCache.set(units, (m = new Map(units.map((u) => [u.id, u]))));
      return m;
    };
    const shapeCache = new Map();
    /** Path string of a state / district feature as drawn in the current view (falls back to real geography). */
    function shapeFor(state, f) {
      const ev = effectiveView(state.view, state.scope, state.mode), mode = state.mode, ck = `${ev}:${mode}:${f.id}`;
      let d = shapeCache.get(ck);
      if (d !== undefined) return d;
      const units = ev === "hex" ? hexUnits(mode === "house" ? "district" : "state")
        : ev === "tiles" ? tilesUnits()
          : ev === "bubble" ? (mode === "house" ? bubbleUnits("house", "fine") : null)
            : ev === "cartogram" ? bubbleUnits(mode, "race") : null;
      d = (units && unitIndex(units).get(f.id)?.d) || geoPath(f);
      shapeCache.set(ck, d);
      return d;
    }

    /** Quality check for the House hex layout: how many states ended up in more than one piece? */
    const hexSplitStates = (() => {
      const adj = HEX_SQ3 * HEX_R.district * 1.15, out = [];
      for (const [sid, us] of d3.group(hexUnits("district"), (u) => u.state)) {
        const seen = new Set(); let comps = 0;
        for (const u of us) {
          if (seen.has(u)) continue;
          comps++; seen.add(u);
          const stack = [u];
          while (stack.length) {
            const c = stack.pop();
            for (const v of us) if (!seen.has(v) && Math.hypot(v.circle.cx - c.circle.cx, v.circle.cy - c.circle.cy) < adj) { seen.add(v); stack.push(v); }
          }
        }
        if (comps > 1) out.push(`${STATE_ABBR[sid]}:${comps}`);
      }
      return out;
    })();
    display({
      hexStates: hexUnits("state").length, hexDistricts: hexUnits("district").length,
      uniqueDistrictCells: new Set(hexUnits("district").map((u) => u.circle.cx + "," + u.circle.cy)).size,
      houseHexStatesInMoreThanOnePiece: hexSplitStates,
      senateCircles: bubbleUnits("senate", "fine").length, houseCircles: bubbleUnits("house", "fine").length
    });

    // ───────────── FILLS: what colour is each shape right now? ─────────────
    // Strength of colour = certainty.
    //   no votes yet → flat grey
    //   IN PLAY      → pale-to-mid tint of the leader (never as strong as a called race); the map overlay also lifts it off the page
    //   CALLED       → the full, hard party colour, flat
    // Counties are areas, not races, so they keep the plain margin gradient.
    // States with no race this year are deliberately BORING: the holding party's tint, drained towards neutral grey.
    // VOTE CIRCLES (bubble / cartogram views): the shape is the grey "whole vote"; the coloured disc inside it is drawn by
    // renderBubbles, using bubbleInner below.

    /**
     * race: true  = called race (hard colour)
     *       false = race still in play (pale → mid tint, scaled by margin)
     *       null  = not a race (county): full-range margin gradient
     */
    function marginColor(agg, race = null) {
      const { dem = 0, rep = 0, ind = 0, reported = 0 } = agg;
      if (reported <= 0) return THEME.UNREPORTED;

      const total = dem + rep + ind;
      if (total <= 0) return THEME.UNREPORTED;

      // Determine leader and runner-up
      const ranked = [
        { party: "D", votes: dem, col: THEME.D_COL, tint: THEME.D_TINT },
        { party: "R", votes: rep, col: THEME.R_COL, tint: THEME.R_TINT },
        { party: "I", votes: ind, col: THEME.I_COL || "#d97706", tint: THEME.I_TINT || "#fef3c7" }
      ].sort((a, b) => b.votes - a.votes);

      const leader = ranked[0];
      const runnerUp = ranked[1];
      const leadMargin = (leader.votes - runnerUp.votes) / total;

      if (race === true) return leader.col;   // called: hard colour

      // Scale margin depth: 0% lead (tint) -> 30%+ lead (strongest allowed for this state of the race)
      const marginT = clamp(leadMargin / 0.30, 0, 1);
      const strongest = race === false ? d3.interpolateRgb(leader.tint, leader.col)(0.5) : leader.col;
      const targetColor = d3.interpolateRgb(leader.tint, strongest)(marginT);

      // Confidence weighting: 0% = UNREPORTED, scales up rapidly so early leads are visible
      const confidence = clamp(reported * 4, 0.45, 1.0);
      return d3.interpolateRgb(THEME.UNREPORTED, targetColor)(confidence);
    }

    /**
     * Context shading: when zoomed into a state, everything else keeps its real colour
     * (live results, or the holding-party tint) but is washed toward white so the
     * focused state still pops while you can see what's going on around it.
     */
    const CONTEXT_FADE = 0.55; // 0 = full colour, 1 = fully washed out
    function contextFade(color) {
      return d3.interpolateRgb(color, THEME.BG)(CONTEXT_FADE);
    }

    /** Who holds the seat(s) in a state that has no race this year. */
    function holdersOf(mode, sid) {
      if (mode === "senate") return incumbents.senate.get(sid) || [];
      const g = mode === "governor" ? incumbents.governor.get(sid) : null;
      return g ? [g] : [];
    }

    /** Drain a holding-party tint toward neutral so places with no race recede behind the live contests. */
    const HOLD_MUTE = 0.5;
    const holdMute = (tint) => d3.interpolateRgb(tint, "#f1f5f9")(HOLD_MUTE);

    /** Muted tint of the holding party (or split/independent) for states with no race. */
    function tintFor(mode, sid) {
      const parties = new Set(holdersOf(mode, sid).map((p) => p.caucus || p.party));
      if (parties.size === 0) return THEME.GREY;
      if (parties.size > 1) return THEME.SPLIT_TINT;

      if (parties.has("D")) return holdMute(THEME.D_TINT);
      if (parties.has("R")) return holdMute(THEME.R_TINT);
      if (parties.has("I") || parties.has("IND") || parties.has("ID")) return holdMute(THEME.I_TINT || "#fef3c7");

      return THEME.GREY;
    }

    function stateFillColor(state, feat) {
      const rows = MODEL[state.mode].byState.get(feat.id);
      let base;
      if (rows) {
        const a = aggregate(rows, state.T);
        base = marginColor(a, callFor(null, a) != null);   // a state is a race: called → hard colour, else in play
      } else {
        base = tintFor(state.mode, feat.id);
      }
      // Zoomed into a state: neighbours stay visible, just faded.
      return state.scope ? contextFade(base) : base;
    }

    function unitFillColor(state, feat) {
      const s = MODEL[state.mode].simById.get(feat.id);
      if (!s) return THEME.GREY;
      const a = aggregate([s], state.T);
      // House districts are races; counties (senate/governor) are just areas inside a race.
      const base = marginColor(a, state.mode === "house" ? callFor(null, a) != null : null);
      // House mode: districts in other states are faded context.
      if (state.mode === "house" && state.scope && stateOf(feat) !== state.scope) return contextFade(base);
      return base;
    }

    // ── Vote circles ──
    const outOfScope = (state, u) => !!state.scope && u.state !== state.scope;
    /** Votes still to come: a clearly visible slate grey (darker than the "unreported" grey, so the rim around the counted disc reads). */
    const BUBBLE_REMAIN = THEME.BORDER;
    /** The outer disc is the whole vote still to come (washed out outside the zoomed state). */
    function bubbleRemainFill(state, u) {
      return outOfScope(state, u) ? contextFade(BUBBLE_REMAIN) : BUBBLE_REMAIN;
    }
    /** Tally behind a vote circle: a state's rows (race circle) or one county / district. */
    function bubbleTally(state, u) {
      const data = MODEL[state.mode];
      const rows = u.level === "state" ? data.byState.get(u.id) : [data.simById.get(u.feat.id)];
      return rows?.[0] ? aggregate(rows, state.T) : null;
    }
    /** The coloured disc inside a vote circle: `frac` = share of the vote counted (disc AREA), `col` = who leads it (hard colour once called). */
    function bubbleInner(state, u) {
      const a = bubbleTally(state, u);
      if (!a || a.reported <= 0) return { frac: 0, col: THEME.UNREPORTED };
      const col = marginColor(a, callFor(null, a) != null ? true : null);
      return { frac: a.reported, col: outOfScope(state, u) ? contextFade(col) : col };
    }

    /** The fill for any unit; `fillOverride` lets a morphing shape blend toward its destination colour. */
    function fillFor(state, u) {
      if (u.fillOverride) return u.fillOverride;
      if (u.bubble) return bubbleRemainFill(state, u);
      return u.level === "state" ? stateFillColor(state, u.feat) : unitFillColor(state, u.feat);
    }

    // ───────────── TOOLTIP: content + positioning ─────────────

    function whoHTML(p) {
      const party = p.party || p.caucus || "—";

    }

    const swatchStyle = "display:inline-block;width:16px;height:10px;border-radius:2px;";

    /** Called: flat, hard party colour (the race has settled back onto the page). */
    function calledChip(party) {
      return `<span style="${chipStyle}"><span style="${swatchStyle}background:${partyFill(party)}"></span>CALLED</span>`;
    }
    /** In play: pale tint, lifted off the page by a shadow (as on the map). */
    function playChip(party) {
      return `<span style="${chipStyle}"><span style="${swatchStyle}background:${partyMid(party)};box-shadow:0 2px 3px rgba(0,0,0,0.6)"></span>IN PLAY</span>`;
    }
    /** Flip: stripes in the new leader's colour alternating with white (as on the map), then from → to. */

      return `<span style="${chipStyle}"><span style="${swatchStyle}background:repeating-linear-gradient(135deg, ${partyFill(to)} 0 3px, #ffffff 3px 6px)"></span>${partyBadge(from)}<span style="color:#94a3b8">→</span>${partyBadge(to)}</span>`;

    }

    /** Who holds / is up in a state, formatted for the tooltip */

    /** hit = {level: "state"|"county"|"district", d: feature} */

    /** Glassmorphism card styling and viewport-safe boundary detection */

      view.tipEl.style.width = "max-content";

      view.tipEl.style.top = "0px";

      view.tipEl.innerHTML = tipHTML(state, hit);

      const [x, y] = d3.pointer(event, view.root);

      const tipH = view.tipEl.offsetHeight || 165;

      let posX = (x + tipW + 24 > rootW) ? (x - tipW - 14) : (x + 14);
      let posY = (y + tipH + 24 > rootH) ? (y - tipH - 12) : (y + 14);
      posX = clamp(posX, 8, Math.max(8, rootW - tipW - 8));
      posY = clamp(posY, 8, Math.max(8, rootH - tipH - 8));
      // `keepClear` (the strip): never cover the strip (axis, pills, swing gauges) or the spotlighted shape on the map.
      if (keepClear) {
        const rr = view.root.getBoundingClientRect();
        const box = (el, pad) => { const r = el.getBoundingClientRect(); return { l: r.left - rr.left - pad, t: r.top - rr.top - pad, r: r.right - rr.left + pad, b: r.bottom - rr.top + pad }; };
        const avoid = [box(keepClear, 6)];
        const spot = [...view.root.querySelectorAll("path.spot")].pop();
        if (spot) avoid.push(box(spot, 10));
        const free = (l, t) => avoid.every((a) => l + tipW <= a.l || l >= a.r || t + tipH <= a.t || t >= a.b);
        const strip = avoid[0];
        const xs = [x + 14, x - tipW - 14, 8, rootW - tipW - 8, ...(spot ? [avoid[1].l - tipW, avoid[1].r] : [])].map((v) => clamp(v, 8, Math.max(8, rootW - tipW - 8)));
        const ys = [strip.t - tipH, strip.b, 8, avoid[1] ? avoid[1].b : 8, avoid[1] ? avoid[1].t - tipH : 8].map((v) => clamp(v, 8, Math.max(8, rootH - tipH - 8)));
        let best = null, bestCost = Infinity;
        for (const yy of ys) for (const xx of xs) {
          if (!free(xx, yy)) continue;
          const cost = Math.abs(xx - (x + 14)) + 2 * Math.abs(yy - (strip.t - tipH));
          if (cost < bestCost) { bestCost = cost; best = [xx, yy]; }
        }
        if (best) [posX, posY] = best;
        else posY = clamp(strip.t - tipH, 8, Math.max(8, rootH - tipH - 8));
      }

      view.tipEl.style.left = `${posX}px`;
      view.tipEl.style.top = `${posY}px`;
      view.tipEl.style.opacity = 1;
    }

    function hideTip(view, state) {
      state.hover = null;
      view.tipEl.style.opacity = 0;
    }

    /** Live-updating re-render as vote clock T ticks */
    function refreshTip(view, state) {
      if (state.hover) {
        view.tipEl.innerHTML = tipHTML(state, state.hover);
      }
    }

    // ───────────── MARGIN STRIP: clickable pills positioned by margin ─────────────
    // Nation: flips + close races on a linear ±20-pt axis. Zoomed into a state: every race, on a √-scaled axis to ±80.
    // A pill can carry a small grey capsule on its right edge: a mini gauge of the SWING since the seat's last
    // election – hollow ring = where it was, filled dot = where it is now, arrow between (see lastElection).
    // The gauge uses the same scale and orientation as the strip (Democrat left, Republican right).
    // HOVER: the hovered pill's "before" is shown on the axis itself – a hollow ring where the seat was last time
    // (or, with no previous result, where the polls/forecasters had it), an arrow to where it is now. Every other pill
    // drops back (faded + greyed) so the hovered race is the only thing in focus.
    const STRIP = { PH: 22, LH: 28, LANES: 8, SCOPE_MAX: 40, STOP: 48, MIN_SCOPE_LANES: 3 };
    const STRIP_CX = THEME.W / 2, STRIP_HW = (THEME.W - 100) / 2;
    const GAUGE_W = 56;              // width of the mini track
    const GAUGE_TW = GAUGE_W + 22;   // visible width of the capsule (track + padding for the rounded end)

    /**
     * X-position of a margin m:
     * m > 0 (Dem/Ind lead) -> Left of center
     * m < 0 (Rep lead) -> Right of center
     */
    function marginX(axisR, m) {
      const r = axisR ?? 0.2;
      const sign = Math.sign(m);
      const mag = Math.min(Math.abs(m), r);

      if (r > 0.2) {
        // State view (sqrt scale to ±80 pts)
        return STRIP_CX - sign * STRIP_HW * Math.sqrt(mag / 0.8);
      } else {
        // National view (linear scale to ±20 pts)
        return STRIP_CX - clamp(m / 0.2, -1, 1) * STRIP_HW;
      }
    }

    function stripAxisFor(state) { return state.scope ? 0.8 : 0.2; }
    function stripHeightFor(state, lanesUsed) {
      const lanes = state.scope ? Math.max(STRIP.MIN_SCOPE_LANES, lanesUsed) : Math.max(1, lanesUsed);
      return STRIP.STOP + lanes * STRIP.LH + 12;
    }

    function pillLabel(state, d) {
      const base = state.mode === "house"
        ? districtLabel(d.c.feature)
        : stateName(d.c.id);
      if (d.kind === "flip") return base;
      return state.mode === "house"
        ? base + (d.c.inc ? " " + (d.c.inc.last || "") : "")
        : base + (d.c.inc ? " · " + (d.c.inc.last || "") : "");
    }

    function pillText(state, d) {
      const label = pillLabel(state, d);
      const toParty = d.to || (d.m >= 0 ? "D" : "R");
      const icon = toParty === "I" ? "◆" : d.kind === "flip" ? "▲" : d.kind === "close" ? "◌" : d.kind === "called" ? "●" : "";
      const winnerName = d.c?.cands?.[toParty] || (toParty === "D" ? "Democrat" : toParty === "R" ? "Republican" : toParty);
      if (d.kind === "flip") return `${icon} ${winnerName} · ${label}`;
      if (d.kind === "called") return `${icon} ${winnerName} · ${label}`;
      if (d.kind === "close") return `${icon} ${label}`;
      return `${icon ? icon + " " : ""}${label}`;
    }

    function pillFill(d) {
      const toParty = d.to || (d.m >= 0 ? "D" : "R");
      if (toParty === "I" || toParty === "IND") {
        return d.kind === "flip" || d.kind === "called" ? THEME.I_COL : THEME.I_TINT;
      }
      if (d.kind === "flip" || d.kind === "called") return partyFill(toParty);
      if (d.kind === "close") return "#ffffff";
      return toParty === "D" ? THEME.D_TINT : THEME.R_TINT;
    }

    function pillTextColor(d) {
      const toParty = d.to || (d.m >= 0 ? "D" : "R");
      if (d.kind === "flip" || d.kind === "called") return "#ffffff";
      if (toParty === "I" || toParty === "IND") return THEME.I_DARK || "#b45309";
      if (toParty === "D") return THEME.D_DARK;
      if (toParty === "R") return THEME.R_DARK;

    /**
     * Lane layout. A pill is `w` wide, plus `tw` for its swing capsule (0 when there's no previous result);
     * lanes are packed on the full width so neighbouring pills never overlap a capsule.
     * The main pill stays centred on its current margin.
     */
    function layoutPills(state, items, axisR, maxLanes) {
      const lanes = [], out = [];
      for (const d of [...items].sort((a, b) => Math.abs(a.m) - Math.abs(b.m))) {
        const text = pillText(state, d);
        const w = text.length * 6.6 + 22;
        const prev = lastElection(state.mode, d.c);
        const tw = prev ? GAUGE_TW : 0;
        const targetX = marginX(axisR, d.m);
        const x0 = clamp(targetX - w / 2, 8, THEME.W - 8 - (w + tw));
        const x1 = x0 + w + tw;

        let lane = lanes.findIndex((l) => l.every((p) => p.x0 - 6 >= x1 || p.x1 + 6 <= x0));
        if (lane < 0) {
          if (lanes.length >= maxLanes) continue;
          lanes.push([]);
          lane = lanes.length - 1;
        }
        lanes[lane].push({ x0, x1 });

    /**
     * Draw the swing gauge inside a pill's capsule.
     *   track  – the margin scale, with a tick at 0 (tied)
     *   ○ ring – where this seat was last election (party colour of that winner)
     *   ● dot  – where it is now (party colour of the current leader)
     *   →      – the swing between them
     * Same scale/orientation as the strip: Democrat left, Republican right.
     */
    function updateGauge(g, d, axisR) {
      g.selectAll("*").remove();
      g.attr("display", d.prev ? null : "none");
      if (!d.prev) return;

      const cy = STRIP.PH / 2;
      const gx = (m) => GAUGE_W / 2 - ((STRIP_CX - marginX(axisR, m)) / STRIP_HW) * (GAUGE_W / 2);
      const px = gx(d.prev.m), nx = gx(d.m);
      const prevCol = d.prev.m >= 0 ? THEME.D_COL : THEME.R_COL;
      const nowCol = partyFill(d.to || (d.m >= 0 ? "D" : "R"));

      g.attr("transform", `translate(${d.w + 8},0)`);

      g.append("line").attr("x1", 0).attr("x2", GAUGE_W).attr("y1", cy).attr("y2", cy)
        .attr("stroke", "#cbd5e1").attr("stroke-width", 2).attr("stroke-linecap", "round");
      g.append("line").attr("x1", GAUGE_W / 2).attr("x2", GAUGE_W / 2).attr("y1", cy - 5).attr("y2", cy + 5)
        .attr("stroke", "#64748b").attr("stroke-width", 1);

          .attr("stroke", "#334155").attr("stroke-width", 1.6);
        g.append("path")
          .attr("d", `M${tip},${cy} L${tip - dir * 5},${cy - 3.2} L${tip - dir * 5},${cy + 3.2} Z`)
          .attr("fill", "#334155");
      }

      g.append("circle").attr("cx", px).attr("cy", cy).attr("r", 4.2)
        .attr("fill", "#ffffff").attr("stroke", prevCol).attr("stroke-width", 1.7);
      g.append("circle").attr("cx", nx).attr("cy", cy).attr("r", 2.8)
        .attr("fill", nowCol).attr("stroke", "#ffffff").attr("stroke-width", 0.8);
    }

    /** Where was this seat before? Last election if we have it, else the pre-election polls / forecast. */
    function beforeFor(state, d) {
      if (d.prev) return { m: d.prev.m, label: `LAST TIME (${d.prev.year})` };
      const fm = forecastMargin(state.mode, d.c.id);

    }

    const GHOST_Y = 36;   // the ghost lives on the axis, between the headings and the tick labels

    /** Hover view: ○ where it was → ● where it is now, drawn on the axis, with a guide down to the pill. */

      grp.append("line").attr("x1", gx).attr("x2", gx).attr("y1", GHOST_Y).attr("y2", d.y + STRIP.PH / 2)
        .attr("stroke", beforeCol).attr("stroke-width", 1).attr("stroke-dasharray", "2 2").attr("opacity", 0.55);
      grp.append("line").attr("x1", nx).attr("x2", nx).attr("y1", GHOST_Y).attr("y2", d.y)
        .attr("stroke", nowCol).attr("stroke-width", 1).attr("opacity", 0.55);

      const dx = nx - gx;
      if (Math.abs(dx) > 9) {
        const dir = Math.sign(dx), tip = nx - dir * 4;
        grp.append("line").attr("x1", gx + dir * 5).attr("x2", tip - dir * 4).attr("y1", GHOST_Y).attr("y2", GHOST_Y)
          .attr("stroke", "#334155").attr("stroke-width", 1.8);
        grp.append("path").attr("d", `M${tip},${GHOST_Y} L${tip - dir * 6},${GHOST_Y - 3.6} L${tip - dir * 6},${GHOST_Y + 3.6} Z`).attr("fill", "#334155");
      }
      grp.append("circle").attr("cx", gx).attr("cy", GHOST_Y).attr("r", 5)
        .attr("fill", "#ffffff").attr("stroke", beforeCol).attr("stroke-width", 2).attr("stroke-dasharray", before.label === "FORECAST" ? "2 1.5" : null);
      grp.append("circle").attr("cx", nx).attr("cy", GHOST_Y).attr("r", 3.4)
        .attr("fill", nowCol).attr("stroke", "#ffffff").attr("stroke-width", 1);
      const pts = (Math.abs(before.m) * 100).toFixed(0);
      grp.append("text").attr("x", gx).attr("y", 25).attr("text-anchor", "middle")
        .attr("font-size", 9.5).attr("font-weight", 700).attr("letter-spacing", 0.4).attr("fill", "#475569")
        .attr("paint-order", "stroke").attr("stroke", "#ffffff").attr("stroke-width", 3)
        .text(`${before.label} · ${before.m >= 0 ? "D" : "R"}+${pts}`);
      grp.transition().duration(150).attr("opacity", 1);
    }

    function hideGhost(strip) {
      strip.ghostG.selectAll("g.ghost").interrupt().transition().duration(120).attr("opacity", 0).remove();
    }

    function createStrip(root) {
      const { W } = THEME;
      const RH = STRIP.STOP + STRIP.LANES * STRIP.LH + 12;
      const svg = d3.create("svg")
        .attr("viewBox", [0, 0, W, RH])
        .style("width", "100%")
        .style("height", `${RH}px`)
        .style("display", "block")
        .style("margin-top", "12px")
        .style("background", "transparent")
        .style("font-family", "system-ui, -apple-system, sans-serif")
        .style("font-variant-numeric", "tabular-nums");

      root.append(svg.node());

      const waitNote = html`<div style="font-size:11.5px; color:#64748b; margin-top:6px; min-height:16px; font-family:system-ui,-apple-system,sans-serif;"></div>`;
      root.append(waitNote);

      const axisG = svg.append("g");
      const titleEl = svg.append("text").attr("x", 8).attr("y", 14).attr("font-size", 10.5).attr("font-weight", 700).attr("fill", "#64748b").attr("letter-spacing", 0.6);
      svg.append("text").attr("x", 8).attr("y", 28).attr("font-size", 11.5).attr("font-weight", 700).attr("fill", THEME.D_LABEL).text("← Democrat leads");
      svg.append("text").attr("x", W - 8).attr("y", 28).attr("font-size", 11.5).attr("font-weight", 700).attr("text-anchor", "end").attr("fill", THEME.R_LABEL).text("Republican leads →");
      svg.append("text").attr("x", W / 2).attr("y", 14).attr("font-size", 10).attr("font-weight", 600).attr("text-anchor", "middle").attr("fill", "#94a3b8").text("TIED");

      const pillsG = svg.append("g");
      const ghostG = svg.append("g").attr("class", "ghosts").attr("pointer-events", "none");
      const emptyEl = svg.append("text")
        .attr("pointer-events", "none")
        .attr("x", W / 2)
        .attr("y", STRIP.STOP + 50)
        .attr("text-anchor", "middle")
        .attr("font-size", 13)
        .attr("font-weight", 500)
        .attr("fill", "#94a3b8");

      const strip = { svg, axisG, titleEl, pillsG, ghostG, emptyEl, waitNote, axisR: null, RH };
      setStripAxis(strip, 0.2);
      return strip;
    }

    function setStripHeight(strip, h) {
      strip.RH = h;
      strip.svg
        .attr("viewBox", [0, 0, THEME.W, h])
        .style("height", `${h}px`);
      strip.axisG.selectAll("line.axl").attr("y2", h - 4);
      strip.axisG.select("rect.band").attr("height", Math.max(10, h - 30));
    }

    function setStripAxis(strip, r) {
      strip.axisR = r;
      const g = strip.axisG;
      g.selectAll("*").remove();

      g.append("rect")
        .attr("class", "band")
        .attr("x", marginX(r, 0.05))
        .attr("y", 24)
        .attr("width", marginX(r, -0.05) - marginX(r, 0.05))
        .attr("fill", "#f8fafc")
        .attr("rx", 3);

      const ticks = r > 0.2 ? [-0.8, -0.4, -0.2, -0.1, -0.05, 0, 0.05, 0.1, 0.2, 0.4, 0.8] : [-0.2, -0.1, -0.05, 0, 0.05, 0.1, 0.2];
      for (const v of ticks) {
        const x = marginX(r, v);
        g.append("line")
          .attr("class", "axl")
          .attr("x1", x).attr("x2", x)
          .attr("y1", v === 0 ? 14 : 32)
          .attr("stroke", v === 0 ? "#475569" : "#e2e8f0")
          .attr("stroke-width", v === 0 ? 1.5 : 1)
          .attr("stroke-dasharray", v === 0 ? null : "2 3");

        if (v !== 0) {
          g.append("text")
            .attr("x", x)
            .attr("y", 44)
            .attr("font-size", 9.5)
            .attr("font-weight", 500)
            .attr("text-anchor", "middle")
            .attr("fill", "#94a3b8")
            .text(`${Math.round(Math.abs(v) * 100)}${Math.abs(v) >= r - 1e-9 ? "+" : ""}`);
        }
      }
      setStripHeight(strip, strip.RH);
    }

    function renderStrip(strip, state, items, onPick, view) {
      const r = stripAxisFor(state);
      if (r !== strip.axisR) setStripAxis(strip, r);

      const { out: placed, used } = layoutPills(state, items, strip.axisR, state.scope ? STRIP.SCOPE_MAX : STRIP.LANES);
      const h = stripHeightFor(state, used);
      if (h !== strip.RH) setStripHeight(strip, h);

      strip.emptyEl
        .text(state.scope ? "No votes reported yet in this state" : "No flips or close races yet")
        .attr("opacity", placed.length ? 0 : 1);

      const legend = hasLastElection(state.mode) ? "  ·  GREY GAUGE: ○ LAST TIME → ● NOW" : "";
      strip.titleEl.text((state.scope
        ? `ALL ${MODES[state.mode].label.toUpperCase()} RACES IN ${stateName(state.scope).toUpperCase()} · CURRENT MARGIN`
        : "KEY BATTLEGROUNDS & POTENTIAL FLIPS · CLICK TO ZOOM · HOVER FOR DETAILS") + legend);

      // Everything but the hovered pill drops back: faded and greyed, so it reads as background.
      const dimOthers = (d) => strip.pillsG.selectAll("g.pill")
        .style("opacity", (p) => (!d || p === d ? null : 0.3))
        .style("filter", (p) => (!d || p === d ? null : "grayscale(0.9)"));

      const sel = strip.pillsG.selectAll("g.pill").data(placed, (d) => d.c.id).join(
        (enter) => {
          const g = enter.append("g")
            .attr("class", "pill")
            .attr("opacity", 0)
            .style("transition", "opacity 150ms, filter 150ms")
            .attr("transform", (d) => `translate(${d.x},${d.y})`);

          // Swing capsule first, so the main pill sits on top and hides its rounded left end.
          g.append("rect").attr("class", "tail")
            .attr("height", STRIP.PH).attr("rx", STRIP.PH / 2)
            .attr("fill", "#f1f5f9").attr("stroke", "#cbd5e1").attr("stroke-width", 1);
          g.append("g").attr("class", "gauge").style("pointer-events", "none");

          g.append("rect").attr("class", "main")
            .attr("height", STRIP.PH)
            .attr("rx", STRIP.PH / 2)
            .attr("filter", "drop-shadow(0 1px 2px rgba(0,0,0,0.08))");

          g.append("text").attr("class", "label")
            .attr("y", STRIP.PH / 2 + 3.5)
            .attr("text-anchor", "middle")
            .attr("font-size", 11)
            .attr("font-weight", 600);

          if (view) {
            const level = () => (state.mode === "house" ? "district" : "state");
            g.on("pointerenter", (e, d) => {
              d3.select(e.currentTarget).select("rect.main").attr("stroke-width", 2);
              dimOthers(d);                          // drop the other pills back…
              view.spotlight?.(d.c.feature);         // …darken the map except this contest…
              showGhost(strip, state, d);            // …and show where this one was before
              showTip(view, state, e, { level: level(), d: d.c.feature }, strip.svg.node());
            })
              .on("pointermove", (e, d) => {
                showTip(view, state, e, { level: level(), d: d.c.feature }, strip.svg.node());
              })
              .on("pointerleave", (e) => {
                d3.select(e.currentTarget).select("rect.main").attr("stroke-width", 1.2);
                dimOthers(null);
                hideGhost(strip);
                view.spotlight?.(null);
                hideTip(view, state);
              });
          }

          g.on("click", (e, d) => {
            if (d.c.state !== state.scope) {
              if (view) { hideTip(view, state); view.spotlight?.(null); }
              hideGhost(strip);
              onPick(d.c.state);
            }
          });

          g.transition().duration(150).attr("opacity", 1);
          return g;
        },
        (update) => update,
        (exit) => {
          // A pill can vanish while hovered (no pointerleave fires) – don't leave the map veiled.
          exit.each((d) => { if (view && view.spotId === d.c.feature.id) { view.spotlight?.(null); dimOthers(null); hideGhost(strip); } });
          return exit.transition().duration(120).attr("opacity", 0).remove();
        }
      );

      sel.attr("cursor", (d) => (d.c.state === state.scope ? "default" : "pointer"))
        .attr("transform", (d) => `translate(${d.x},${d.y})`);

      sel.select("rect.main")
        .attr("width", (d) => d.w)
        .attr("fill", pillFill)
        .attr("stroke", (d) => (d.kind === "flip" || d.kind === "called" ? "rgba(0,0,0,0.2)" : d.kind === "close" ? THEME.WARN_COL : "#94a3b8"))
        .attr("stroke-width", 1.2)
        .attr("stroke-dasharray", (d) => (d.kind === "close" ? "2.5 2" : null));

      sel.select("text.label")
        .attr("x", (d) => d.w / 2)
        .text((d) => d.text)
        .attr("fill", pillTextColor);

      // Capsule: starts under the main pill and pokes out to its right.
      sel.select("rect.tail")
        .attr("display", (d) => (d.prev ? null : "none"))
        .attr("x", (d) => d.w - STRIP.PH / 2)
        .attr("width", (d) => d.tw + STRIP.PH / 2);

      sel.each(function (d) { updateGauge(d3.select(this).select("g.gauge"), d, strip.axisR); });
    }

    function renderWaitNote(strip, state, waiting) {
      strip.waitNote.textContent = state.scope && waiting.length ? `Waiting for polls to report (${waiting.length}): ${waiting.join(", ")}` : "";
    }
  </script>
  <script id="30" type="module" pinned="">
    // ───────────── BOARD: scoreboard, chamber-control bar, legend, title, back button ─────────────
    const BOARD = { BX: 360, BW: 590 };

      const barI = voteBarG.append("rect").attr("y", 20).attr("height", 14).attr("fill", THEME.I_COL || "#d97706").attr("width", 0);
      const barR = voteBarG.append("rect").attr("y", 20).attr("height", 14).attr("fill", THEME.R_COL).attr("width", 0);

      // 50% Center indicator marker
      g.append("line")

      const txtD = label(BX, 48, 12, THEME.D_LABEL, 700);
      const txtI = label(BX + BW / 2, 48, 11, THEME.I_DARK || "#b45309", 700, "middle");
      const txtR = label(BX + BW, 48, 12, THEME.R_LABEL, 700, "end");

      // ── 3. BOTTOM BAR: CHAMBER CONTROL & SEAT BALANCE ──
      const balTitle = label(BX, 68, 10, "#888", 700).attr("letter-spacing", 0.8);

      // Segments: [D Hold, D Lead, I Hold, I Lead, Uncounted/Waiting, R Lead, R Hold]
      const colors = [

      ];

      const balSeg = seatBarG.selectAll("rect.seg").data(colors).join("rect")

      g.append("line")

      // ── 4. LEGEND (FOR NON-RACE STATES) ──

      return {
        g, barD, barI, barR, txtD, txtI, txtR, txtP, flipG, flipRect, flipTxt, closeG, closeRect, closeTxt,

    /** Update every number & bar cleanly without drawing phantom votes when data is 0. */
    function renderBoard(board, state, sum) {
      const { BX, BW } = BOARD, { counts, votes, inView } = sum, mode = state.mode;

      // 1. POPULAR VOTE BAR: Completely clear (width = 0) when 0 votes are in
      const indVotes = votes.ind || 0;
      const totalCounted = votes.dem + votes.rep + indVotes;

      if (totalCounted <= 0) {
        // Zero votes counted: bar remains clean neutral gray track
        board.barD.attr("width", 0);
        board.barI.attr("width", 0);
        board.barR.attr("width", 0);

        board.txtD.text("D  0  (—)");
        board.txtI.text("");
        board.txtR.text("(—)  0  R");
      } else {
        const wD = (BW * votes.dem) / totalCounted;
        const wI = (BW * indVotes) / totalCounted;
        const wR = (BW * votes.rep) / totalCounted;

        board.barD.attr("x", BX).attr("width", wD);
        board.barI.attr("x", BX + wD).attr("width", wI);
        board.barR.attr("x", BX + wD + wI).attr("width", wR);

        const dPct = ((votes.dem / totalCounted) * 100).toFixed(1);
        const rPct = ((votes.rep / totalCounted) * 100).toFixed(1);
        const iPct = ((indVotes / totalCounted) * 100).toFixed(1);

        board.txtD.text(`D  ${fmtInt(votes.dem)}  (${dPct}%)`);
        board.txtI.text(indVotes > 0 ? `IND ${fmtInt(indVotes)} (${iPct}%)` : "");
        board.txtR.text(`(${rPct}%)  ${fmtInt(votes.rep)}  R`);
      }

      // Reporting summary line
      board.txtP.text(
        `${fmtPct(votes.reported)} in · Leading: D ${counts.ld} · R ${counts.lr}${counts.li ? ` · IND ${counts.li}` : ""} of ${inView}`
      );

      // 2. STATUS BADGES (Flips and Close)
      const flipCount = counts.fd + counts.fr + (counts.fi || 0);
      const flipLabel = `⚑ Flips: D +${counts.fd} · R +${counts.fr}${counts.fi ? ` · IND +${counts.fi}` : ""}`;
      board.flipTxt.text(flipLabel).attr("x", 8);
      board.flipRect.attr("width", board.flipTxt.node().getComputedTextLength() + 16);

      const closeLabel = `◌ Close: ${counts.close}`;
      board.closeTxt.text(closeLabel).attr("x", 8);
      const flipW = board.flipRect.attr("width") || 110;
      board.closeG.attr("transform", `translate(${+flipW + 8}, 0)`);
      board.closeRect.attr("width", board.closeTxt.node().getComputedTextLength() + 16);

      // 3. CHAMBER BALANCE BAR: Respects 0-reported races cleanly
      const nu = NOT_UP[mode], tot = SEAT_TOTAL[mode];
      const nuI = nu.I || 0;
      const leadI = counts.ni || 0;

      // Uncounted seats are explicitly calculated as what remains of the chamber
      const waitingSeats = Math.max(0, tot - nu.D - counts.nd - nuI - leadI - counts.nr - nu.R);

      // Array of 7 segment widths
      const parts = [
        nu.D,
        counts.nd,
        nuI,
        leadI,
        waitingSeats, // Center neutral gray zone
        counts.nr,
        nu.R
      ];

      let curX = BX;
      board.balSeg.each(function (_, i) {
        const segW = (BW * parts[i]) / tot;
        d3.select(this).attr("x", curX).attr("width", Math.max(0, segW));
        curX += segW;
      });

      // 4. Chamber Majority Headers
      const majority = Math.floor(tot / 2) + 1;
      const totalD = nu.D + counts.nd;
      const totalR = nu.R + counts.nr;
      const totalI = nuI + leadI;

      board.balTitle.text(`${CONTROL_TITLE[mode]} · SEATS NOT UP + CURRENT LEADERS`);
      board.balL.text(`D ${totalD}${nu.D ? ` (${nu.D} hold + ${counts.nd} lead)` : ""}`);
      board.balR.text(`${nu.R ? `(${counts.nr} lead + ${nu.R} hold) ` : ""}R ${totalR}`);

      if (totalI > 0) {
        board.balC.text(`${majority} to win · ${totalI} IND`);
      } else {
        board.balC.text(`${majority} to win`);
      }

      board.legend.attr("display", mode === "house" ? "none" : null);
    }

    /** Crisp title animation on scope change. */
    function drawTitle(board, state, t) {
      const label = `${stateName(state.scope)} · ${MODES[state.mode].label}`;
      board.titleG.selectAll("text").data([label], (d) => d).join(

          .attr("fill", "#0f172a")

          .attr("opacity", 0)
          .text((d) => d)
          .call((e) => e.transition(t).attr("opacity", 1)),

      );

    /** Polished back button with hover effect. */
    function drawBackButton(board, state, t, onBack) {
      const y = THEME.TOP + 12;
