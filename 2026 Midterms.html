          const shrink = 1 - 0.92 * e;
          const cx = p.u.circle.cx + (c0.cx - p.u.circle.cx) * e;
          const cy = p.u.circle.cy + (c0.cy - p.u.circle.cy) * e;
          // scale the real path about its own centroid while translating toward the centre
          p.node.setAttribute("transform",
            `translate(${cx},${cy}) scale(${Math.max(shrink, 0.001)}) translate(${-p.u.circle.cx},${-p.u.circle.cy})`);
          p.node.setAttribute("fill", d3.interpolateRgb(p.fill, dstFill)(e));
          p.node.setAttribute("stroke-opacity", (1 - ramp(lt, 0, 0.3)).toFixed(3));
          p.node.setAttribute("opacity", 1 - ramp(lt, 0.9, 1));
        }
        // the state fills in as the mass arrives
        dstNode.setAttribute("opacity", ramp(t, 0.45, 0.9));
        setStroke(dstNode, t);
      });

      pieces.forEach((p) => p.node.remove());
      settleNode(dstNode);
    }

    const mixFills = (members, fillOf) => {
      // average rgb of member fills, weighted by area
      let r = 0, g = 0, b = 0, w = 0;
      for (const u of members) {
        const c = d3.color(fillOf(u)); if (!c) continue;
        const a = u.circle.r ** 2; r += c.r * a; g += c.g * a; b += c.b * a; w += a;
      }
      return w ? d3.rgb(r / w, g / w, b / w).formatHex() : "#94a3b8";
    };
    const warmColor = (c) => {
      const to = d3.color(c) || d3.color("#94a3b8");
      return d3.interpolateRgb(d3.color("#f8fafc"), to)(0.35);
    };
    const warpAround = (u, s, start = 0.12) => {
      const [cx, cy] = unitCenter(u);
      const scale = d3.interpolateNumber(start, 1)(s);
      return `translate(${cx},${cy}) scale(${scale}) translate(${-cx},${-cy})`;
    };

    async function splitBlob(engine, g, M) {
      const parentNode = g.O[0];
      const parentUnit = parentNode.__data__;
      const parentD = parentNode.getAttribute("d") || parentUnit.d;
      const parentFill = parentNode.getAttribute("fill") || engine.fillOf(parentUnit);
      const its = g.its;

      // The parent stays underneath for a moment; its pieces peel away from it already wearing its colour.
      moveToMotion(engine, parentNode);

      // Only county/district CIRCLES fly out of the parent; map-shaped children morph out of it below.
      if (g.N.length > MANY_PIECES && g.N.some((u) => u.bubble)) {
        return await splitCascade(engine, { node: parentNode, unit: parentUnit }, g.N, M);
      }

      const morphs = g.N.map((childUnit, i) => {
        // Every child gets a real morph: flubber when affordable, otherwise parent -> its circle -> child's circle -> child.
        const it = its[i] || getViaCircle(parentD, circOf(parentUnit), childUnit.d, circOf(childUnit), `${parentUnit.key}>${childUnit.key}:via`);
        let node;
        if (i === 0) {
          node = parentNode;
          node.__data__ = childUnit;
        } else {
          node = makeNode(engine, childUnit, {
            d: it ? it(0) : childUnit.d,
            fill: parentFill,
            opacity: 1
          });
          moveToMotion(engine, node);
        }
        // Last resort (morph budget exhausted): grow out of a point at the child's centre, still never a fade-in.
        const grow = !it;
        if (grow) node.setAttribute("transform", warpAround(childUnit, 0, 0.12));
        node.setAttribute("d", it ? it(0) : childUnit.d);
        node.setAttribute("fill", parentFill);
        node.setAttribute("opacity", 1);
        return { node, it, childUnit, grow, colorIt: d3.interpolateRgb(parentFill, engine.fillOf(childUnit)) };
      });
      parentNode.parentNode.insertBefore(parentNode, parentNode.parentNode.firstChild);
      // Coverage comes from the children themselves: every one of them starts as an exact copy of the parent,
      // so the old parent node is just child 0 morphing like the rest – no separate fading backdrop (that fade is what flashed).
      // The parent's other rings (the U.P.) fly to the children as satellites instead of fading with the parent.
      if (g.sats?.length) parentNode.setAttribute("d", mainRing(parentD));
      const sats = startSats(engine, g);

      await nextFrame();

      await runTween(M, (t) => {
        stepSats(sats, t, (x) => ramp(x, 0.5, 1), true);
        // While the copies are stacked they share one silhouette: any stroke would draw N overlapping borders (the flash).
        // Strokes fade in only as the pieces actually separate, and the last piece keeps the outline through the landing.
        const border = strokeAt(t);
        for (const { node, it, childUnit, grow, colorIt } of morphs) {
          // Every child starts as the whole parent and shrinks into itself; same colour means the overlap is invisible and the goo pinches the necks.
          if (it) node.setAttribute("d", it(ramp(t, 0, 0.8)));
          else node.setAttribute("transform", warpAround(childUnit, d3.easeCubicOut(ramp(t, 0, 0.65)), 0.12));
          const fillNow = colorIt(it ? ramp(t, 0.5, 1) : ramp(t, 0.15, 0.8));
          node.setAttribute("fill", fillNow);
          node.setAttribute("stroke", "#ffffff");
          node.setAttribute("stroke-opacity", border.toFixed(3));
        }
      });

      parentNode.remove();
      morphs.forEach(({ node }) => moveFromMotion(engine, node));
      dropSats(g);
    }

    async function mergeBlobs(engine, g, M) {
      const targetUnit = g.N[0];
      const targetFill = engine.fillOf(targetUnit);
      const its = g.its;
      const many = g.O.length > MANY_PIECES;

      // Only circles fly into the centre; map-shaped pieces morph into the whole below.
      if (many && g.O.some((n) => n.__data__.bubble)) {
        return await mergeCascade(engine, g.O, targetUnit, M);
      }

      // The destination is one of the source districts. It must stay VISIBLE from the first frame and
      // morph from its own original district shape into the full target – popping it to the full shape
      // at opacity 0 makes that district "poof" out of existence on the first frame (e.g. Maine/Vermont).
      const hasSats = !!g.sats?.length;
      const anchorNode = g.O[0];
      const finalNode = anchorNode;
      const finalStartD = anchorNode.getAttribute("d") || targetUnit.d;
      const finalStartFill = anchorNode.getAttribute("fill") || targetFill;
      finalNode.__data__ = targetUnit;
      finalNode.setAttribute("d", hasSats ? mainRing(finalStartD) : finalStartD);
      finalNode.setAttribute("fill", finalStartFill);
      finalNode.setAttribute("opacity", 1);
      markMover(finalNode);
      // The destination morphs from its original district into the full state (flubber, or via-circle fallback).
      const finalIt = getMorphInterpolator(finalStartD, targetUnit.d, `${anchorNode.__data__.key}->${targetUnit.key}`)
        || getViaCircle(finalStartD, circOf(anchorNode.__data__), targetUnit.d, circOf(targetUnit), `${anchorNode.__data__.key}>${targetUnit.key}:via`);
      const finalColorIt = d3.interpolateRgb(finalStartFill, targetFill);

      const morphs = g.O.slice(1).map((node, i) => {
        moveToMotion(engine, node);
        const childUnit = node.__data__;
        const startFill = node.getAttribute("fill") || engine.fillOf(childUnit);
        const startD = node.getAttribute("d") || childUnit.d;
        // Every piece gets a real morph: flubber combine when there are few, otherwise piece -> its circle -> target's circle -> target.
        const it = (its ? its[i + 1] : getMorphInterpolator(startD, targetUnit.d, `${childUnit.key}->${targetUnit.key}`))
          || getViaCircle(startD, circOf(childUnit), targetUnit.d, circOf(targetUnit), `${childUnit.key}>${targetUnit.key}:via`);
        // Last resort (morph budget exhausted): shrink into a point at the piece's centre, still never a fade-out.
        if (!it) node.setAttribute("transform", warpAround(childUnit, 0, 0.18));
        return {
          node,
          it,
          childUnit,
          shrink: !it,
          colorIt: d3.interpolateRgb(startFill, targetFill)
        };
      });

      const sats = startSats(engine, g);

      await nextFrame();

      await runTween(M, (t) => {
        stepSats(sats, t, (x) => ramp(x, 0.05, 0.65), true);
        // Pieces stay solid until the whole shape is already there beneath them; they leave only when nothing would change.
        // Pieces melt their borders as they start moving and land with the shared outline; the stacked phase shows no strokes.
        const border = strokeAt(t);
        for (const { node, it, childUnit, shrink, colorIt } of morphs) {
          if (it) node.setAttribute("d", it(t));
          else node.setAttribute("transform", warpAround(childUnit, 1 - d3.easeCubicIn(ramp(t, 0.2, 1)), 0.18));
          const fillNow = colorIt(ramp(t, 0.05, 0.65));
          node.setAttribute("fill", fillNow);
          node.setAttribute("stroke", "#ffffff");
          node.setAttribute("stroke-opacity", border.toFixed(3));
          node.setAttribute("opacity", 1 - ramp(t, 0.9, 1));
        }
        // The destination stays fully opaque the whole time and morphs from its own district into the
        // full state, so it never reads as blank while the other pieces collapse into it.
        if (finalIt) finalNode.setAttribute("d", finalIt(t));
        finalNode.setAttribute("fill", finalColorIt(ramp(t, 0.05, 0.65)));
        finalNode.setAttribute("opacity", 1);
        setStroke(finalNode, t);
      });

      g.O.slice(1).forEach((n) => d3.select(n).remove());
      if (hasSats) finalNode.setAttribute("d", targetUnit.d);
      settleNode(finalNode);
      dropSats(g);
    }

    async function remixBlobs(engine, g, M) {
      // Old pieces and new shapes meet in the middle: everything travels as circles, merging where the new
      // view is coarser and splitting where it is finer - at the SAME time, so nothing ever pops in or out.
      if (g.N.length >= g.O.length) {
        const oldSnapshots = g.O.map((node) => ({
          unit: node.__data__,
          d: node.getAttribute("d") || node.__data__.d,
          fill: node.getAttribute("fill") || engine.fillOf(node.__data__)
        }));

        g.O.forEach((n) => d3.select(n).remove());

        // Every new shape morphs from the geographically closest old shape: flubber, or via the circle midpoint.
        const morphs = g.N.map((targetUnit) => {
          const source = findClosest(targetUnit, oldSnapshots, (s) => s.unit);
          const it = getMorphInterpolator(source.d, targetUnit.d, `${source.unit.key}->${targetUnit.key}`)
            || getViaCircle(source.d, circOf(source.unit), targetUnit.d, circOf(targetUnit), `${source.unit.key}>${targetUnit.key}:via`);
          const node = makeNode(engine, targetUnit, {
            d: it ? it(0) : targetUnit.d,
            fill: source.fill,
            opacity: 1
          });
          moveToMotion(engine, node);
          if (!it) node.setAttribute("transform", warpAround(targetUnit, 0, 0.01));
          return { node, it, colorIt: d3.interpolateRgb(source.fill, engine.fillOf(targetUnit)) };
        });

        await nextFrame();

        await runTween(M, (t) => {
          for (const { node, it, colorIt } of morphs) {
            if (it) node.setAttribute("d", it(t));
            else node.setAttribute("transform", warpAround(node.__data__, d3.easeCubicOut(ramp(t, 0, 0.7)), 0.01));
            node.setAttribute("fill", colorIt(t));
            setStroke(node, t);
          }
        });

        morphs.forEach(({ node }) => moveFromMotion(engine, node));
      } else {
        const targetSnapshots = g.N.map((u) => ({
          unit: u,
          d: u.d,
          fill: engine.fillOf(u)
        }));

        // Destination shapes exist (invisible) from the start and fade in underneath.
        const finals = g.N.map((u) => {
          const node = makeNode(engine, u, { d: u.d, fill: engine.fillOf(u), opacity: 0 });
          markMover(node);
          return { node, key: u.key };
        });

        const morphs = [];

        g.O.forEach((node) => {
          moveToMotion(engine, node);
          const oldUnit = node.__data__;
          const startD = node.getAttribute("d") || oldUnit.d;
          const startFill = node.getAttribute("fill") || engine.fillOf(oldUnit);

          const target = findClosest(oldUnit, targetSnapshots, (s) => s.unit);

          morphs.push({
            node,
            it: getMorphInterpolator(startD, target.d, `${oldUnit.key}->${target.unit.key}`)
              || getViaCircle(startD, circOf(oldUnit), target.d, circOf(target.unit), `${oldUnit.key}>${target.unit.key}:via`),
            colorIt: d3.interpolateRgb(startFill, target.fill)
          });
        });

        await nextFrame();

        await runTween(M, (t) => {
          const fade = 1 - ramp(t, 0.6, 1);
          for (const { node, it, colorIt } of morphs) {
            if (it) node.setAttribute("d", it(t));
            else node.setAttribute("transform", warpAround(node.__data__, 1 - t, 0.16));
            node.setAttribute("fill", colorIt(t));
            node.setAttribute("opacity", fade);
            setStroke(node, t);
          }
          const inn = ramp(t, 0, 0.4);
          for (const { node } of finals) {
            node.setAttribute("transform", warpAround(node.__data__, inn, 0.12));
            node.setAttribute("opacity", inn);
          }
        });

        g.O.forEach((n) => d3.select(n).remove());
        finals.forEach(({ node }) => settleNode(node));
      }
    }

    // ---- Plan + Execution Engine ----
    function planUnits(engine, newUnits) {
      const t0 = performance.now();

      // SAFETY SWEEP: Round up any orphaned motion nodes stuck from interrupted clicks.
      // Catch movers wherever they live (motion layer OR units layer) — an interrupted
      // navigation can leave "mover"-classed nodes stranded in the units layer, and they
      // would otherwise intercept pointer events and break hover/tooltip in the new mode.
      engine.gM.selectAll("path.sat").remove();
      engine.gz.selectAll("path.mover").each(function () {
        moveFromMotion(engine, this);
      });

      const oldNodes = engine.gz.selectAll("path.unit, path.mover").nodes();
      const oldByKey = new Map(oldNodes.map((n) => [n.__data__.key, n]));
      const newByKey = new Map(newUnits.map((u) => [u.key, u]));

      for (const [k, n] of oldByKey) {
        if (newByKey.has(k)) {
          n.__data__ = newByKey.get(k);
          n.__busy = false;
          n.setAttribute("class", "unit");
          n.setAttribute("opacity", 1);
        }
      }

      const leaving = oldNodes.filter((n) => !newByKey.has(n.__data__.key));
      // Leaving shapes belong to the animation now: renderApp must not recolour or dim them.
      leaving.forEach((n) => markMover(n));

      const groups = [];

      // A shape always morphs into ITS OWN counterpart (same race / district / county in the new view), one to one.
      const incoming = newUnits.filter((u) => !oldByKey.has(u.key));
      const twin = new Map(incoming.map((u) => [`${u.level}:${u.id}`, u]));
      const pairedOld = new Set(), pairedNew = new Set();
      for (const n of leaving) {
        const o = n.__data__, u = twin.get(`${o.level}:${o.id}`);
        if (!u || pairedNew.has(u)) continue;
        const it = getMorphInterpolator(n.getAttribute("d"), u.d, `${o.key}->${u.key}`);
        if (!it) continue;
        pairedOld.add(n); pairedNew.add(u);
        groups.push({ type: "direct_morph", s: getUnitState(u), O: [n], N: [u], it, sats: planSatellites(satItems(o.d, n), satItems(u.d, u), [ringBody(o.d, n)], [ringBody(u.d, u)]) });
      }

      const oldG = d3.group(leaving.filter((n) => !pairedOld.has(n)), (n) => getUnitState(n.__data__));
      const newG = d3.group(incoming.filter((u) => !pairedNew.has(u)), (u) => getUnitState(u));

      // Hex tiles <-> county circles get the binary cascade: tile becomes one big circle, which splits
      // into 2, then 4, then 8... until it lands as the counties (and the reverse when going back).
      const isHex = (u) => !!u.hex, isCirc = (u) => !!u.bubble;
      for (const s of new Set([...oldG.keys(), ...newG.keys()])) {
        const O = oldG.get(s) || [];
        const N = newG.get(s) || [];
        if (!O.length || !N.length) continue;
        const hexToCirc = O.some((n) => isHex(n.__data__)) && N.some((u) => isCirc(u));
        const circToHex = O.some((n) => isCirc(n.__data__)) && N.some((u) => isHex(u));
        if (hexToCirc && O.length === 1 && N.length > 4) {
          groups.push({ type: "cascade_split", s, O, N });
          oldG.delete(s); newG.delete(s);
        } else if (circToHex && N.length === 1 && O.length > 4) {
          groups.push({ type: "cascade_merge", s, O, N });
          oldG.delete(s); newG.delete(s);
        }
      }

      for (const s of new Set([...oldG.keys(), ...newG.keys()])) {
        const O = oldG.get(s) || [];
        const N = newG.get(s) || [];

        if (!O.length) { groups.push({ type: "in", s, N }); continue; }
        if (!N.length) { groups.push({ type: "out", s, O }); continue; }

        if (O.length === 1 && N.length === 1) {
          const it = getMorphInterpolator(O[0].getAttribute("d"), N[0].d, `${O[0].__data__.key}->${N[0].key}`);
          if (it) {
            const o = O[0].__data__, u = N[0];
            groups.push({ type: "direct_morph", s, O, N, it, sats: planSatellites(satItems(o.d, O[0]), satItems(u.d, u), [ringBody(o.d, O[0])], [ringBody(u.d, u)]) });
            continue;
          }
        }

        const type = O.length === 1 ? "split" : N.length === 1 ? "merge" : "remix";
        const grp = { type, s, O, N };
        // Cutting shapes into pieces is the slow part: do it now, before the clock starts, so nothing stalls mid-animation.
        if (type === "merge") {
          grp.startDs = O.map((n) => n.getAttribute("d") || n.__data__.d);
          // Hundreds of pieces are too heavy to cut with flubber; they morph via their circle midpoints instead.
          grp.its = O.length > MANY_PIECES ? null : getPieceInterpolators("combine", N[0].d, grp.startDs, `com:${O.map((n) => n.__data__.key).join("|")}->${N[0].key}`);
          const oSats = O.flatMap((n) => satItems(n.__data__.d, n)), nSats = satItems(N[0].d, N[0]);
          if (oSats.length || nSats.length) grp.sats = planSatellites(oSats, nSats, O.map((n) => ringBody(n.__data__.d, n)), [ringBody(N[0].d, N[0])]);
        } else if (type === "split") {
          const pd = O[0].getAttribute("d") || O[0].__data__.d;
          grp.its = N.map((u) => ((N.length > MANY_PIECES && u.bubble) ? null : getMorphInterpolator(pd, u.d, `${O[0].__data__.key}->${u.key}`)));
          // Islands (the U.P., etc.) fly to their counterparts as satellites even when the main rings morph via circles.
          const pSats = satItems(O[0].__data__.d, O[0]);
          if (pSats.length) grp.sats = planSatellites(pSats, N.flatMap((u) => satItems(u.d, u)), [ringBody(O[0].__data__.d, O[0])], N.map((u) => ringBody(u.d, u)));
        }
        groups.push(grp);
      }

      // The goo filter melts neighbouring pieces together – worth it for a handful of pieces, but with hundreds of
      // moving shapes (House splits/merges) its alpha threshold just flashes the whole layer white for no visible gain.
      const pieces = groups.reduce((a, g) => a + (g.O?.length || 0) + (g.N?.length || 0), 0);
      const goo = groups.length > 0 && pieces <= 40;
      return { groups, cost: performance.now() - t0, goo };
    }

    async function runGroup(engine, g, ms) {
      if (!ms) {
        (g.N || []).forEach((u) => makeNode(engine, u));
        return;
      }

      try {
        switch (g.type) {
          case "direct_morph": {
            const node = g.O[0];
            const targetUnit = g.N[0];
            const startFill = node.getAttribute("fill") || engine.fillOf(node.__data__);
            const targetFill = engine.fillOf(targetUnit);
            const colorIt = d3.interpolateRgb(startFill, targetFill);

            const sats = startSats(engine, g);
            node.__data__ = targetUnit;
            moveToMotion(engine, node);
            sats.forEach((s) => engine.gM.node().appendChild(s.node));

            await runTween(ms, (t) => {
              if (g.it) node.setAttribute("d", g.it(t));
              node.setAttribute("fill", colorIt(t));
              setStroke(node, t);
              stepSats(sats, t, (x) => x, false);
            });

            moveFromMotion(engine, node);
            return dropSats(g);
          }

          case "split":
            return await splitBlob(engine, g, ms);

          case "merge":
            return await mergeBlobs(engine, g, ms);

          case "cascade_split":
            return await splitCascade(engine, { node: g.O[0], unit: g.O[0].__data__ }, g.N, ms);

          case "cascade_merge":
            return await mergeCascade(engine, g.O, g.N[0], ms);

          case "remix":
            return await remixBlobs(engine, g, ms);

          case "in": {
            // Shapes with no counterpart grow out of their own centre as warm-tinted copies of themselves -
            // a bloom, not a fade.
            const nodes = g.N.map((u) => {
              const target = engine.fillOf(u);
              const start = warmColor(target);
              const n = makeNode(engine, u, { fill: start, opacity: 1 });
              markMover(n);
              n.setAttribute("transform", warpAround(u, 0, 0.01));
              return { node: n, start, target };
            });
            await nextFrame();
            await runTween(ms * 0.7, (t) => {
              const o = easeOut(t);
              for (const [i, item] of nodes.entries()) {
                const u = g.N[i];
                item.node.setAttribute("transform", warpAround(u, t, 0.01));
                item.node.setAttribute("fill", d3.interpolateRgb(item.start, item.target)(o));
              }
            });
            nodes.forEach(({ node }) => settleNode(node));
            return;
          }

          case "out": {
            // Shapes with no counterpart shrink into their own centre - never a fade-out.
            await runTween(ms * 0.6, (t) => {
              const s = 1 - d3.easeCubicIn(t);
              for (const n of g.O) {
                const u = n.__data__;
                n.setAttribute("transform", warpAround(u, Math.max(s, 0.001), 1));
                n.setAttribute("stroke-opacity", (1 - t).toFixed(3));
              }
            });
            g.O.forEach((n) => d3.select(n).remove());
            return;
          }

          default: {
            g.O.forEach((n) => d3.select(n).remove());
            g.N.forEach((u) => makeNode(engine, u));
          }
        }
      } finally {
        dropSats(g);
        if (g.O) {
          g.O.forEach((n) => {
            if (n && n.isConnected && n.parentNode === engine.gM.node()) moveFromMotion(engine, n);
          });
        }
      }
    }

    function runPlan(engine, plan, ms) {
      return Promise.all(plan.groups.map((g) => runGroup(engine, g, ms)));
    }

    async function warmCaches(units, shouldStop) {
      await new Promise((r) => setTimeout(r, 1500));
      if (shouldStop()) return;

      const byState = d3.group(units, (u) => u.state || stateOf(u.feat));
      for (const [sid, stateUnits] of byState) {
        if (shouldStop()) return;
        try {
          if (stateUnits.length > 0) {
            const sampleU = stateUnits[0];
            getMorphInterpolator(sampleU.d, sampleU.d, `${sid}-warm`);
          }
        } catch (e) { }
        await new Promise((r) => setTimeout(r, 20));
      }
    }
  </script>

    // ───────────── VIEW LAYERS: what sits on top of / under the shapes in the alternate views ─────────────
    // All of these hide while shapes are morphing and fade back in once when they land (design rule 1).

    /**
     * VOTE CIRCLES: the coloured disc inside each grey circle.
     *   disc AREA = share of that circle's vote counted (so you see where the vote is, and what's left = the grey rim)
     *   disc COLOUR = who leads the count (hard colour once called). Redrawn every frame, like the shape fills.
     */
    function bubbleLook(state, d, statusMap) {

        g.append("defs").append("filter").attr("id", "viz-raise").attr("x", "-5%").attr("y", "-5%").attr("width", "110%").attr("height", "112%")
          .append("feDropShadow").attr("dx", 0).attr("dy", 2.2).attr("stdDeviation", 2.4).attr("flood-color", "#0f172a").attr("flood-opacity", 0.38);

        .attr("d", (d) => d.d)

    /** Highlight the active mode and map-style buttons (pass `active`/`activeView` to show the destination before a morph finishes). */
    function styleControls(controls, state, active = state.mode, activeView = state.view) {

    // ───────────── APP: state + the functions that wire modules together ─────────────
    // app = {root, svg, view:{root,tipEl,spotId,spotlight}, state, engine, board, strip, controls}
    // state.view = map style (see VIEWS). Hex tiles / cartogram can't zoom, so a scoped state shows real geography (effectiveView).
    //
    // Layer order inside the zoomable group, bottom → top:

    function createState() {
      return {
        scope: null, mode: "senate", view: "map", T: 0.5, flipsOnly: false,   // what the user is looking at
        playing: false, timer: null, stopped: false,             // election-night playback
        hover: null, curK: 1, statusMap: new Map(),              // per-frame bookkeeping
        navBusy: false, pendingNav: null                         // one morph at a time; newest target wins
      };

    // ---- hover / spotlight overlays ----
    // Drawn on their own top layer (engine.gS) so shapes are never restyled or re-ordered:

    //   path.spot   – darkens everything except one contest (used when hovering a pill) + outlines it

    /** Outline the shape under the pointer without touching the shape itself. Hex tiles also show the vote inside. */
    function highlightUnit(app, node, on) {
      const g = app.engine.gS;
      g.selectAll(".hover").remove();
      if (!on || node.__busy) return;
      const u = node.__data__;
      if (u?.hex && u.circle) { hexHoverVote(app, g, u); return; }

        .attr("stroke", "#ffffff").attr("stroke-width", 4).attr("stroke-linejoin", "round").attr("vector-effect", "non-scaling-stroke");

    /** A hovered hex pops up slightly and shows the race inside it: one bar, split by vote (counted parties, uncounted in grey), with the leader's share. */
    function hexHoverVote(app, g, u) {
      const { state } = app, { cx, cy } = u.circle;
      const R = HEX_R[u.level] * 0.97, k = u.level === "district" ? 2.6 : 1.12;
      const hg = g.append("g").attr("class", "hover").attr("transform", `translate(${cx},${cy}) scale(${k}) translate(${-cx},${-cy})`);

            .attr("fill", "#ffffff").attr("stroke", "#0f172a").attr("stroke-width", 3 / k).attr("paint-order", "stroke").attr("stroke-linejoin", "round")

        .attr("stroke", "#0f172a").attr("stroke-width", 1.8).attr("stroke-linejoin", "round").attr("vector-effect", "non-scaling-stroke");
    }

    /** Darken the whole map except `feature` (a state or district feature), and outline it. Pass null to clear. */

    // ---- rendering ----

    // ---- navigation ----
    /** Go to a state (or the nation, null), optionally switching mode and/or map style too. Resolves when the morph ends. */

        const gooStd = THEME.GOO_STD / Math.sqrt(kFrom * cam.k);
        if (plan.goo) t.tween("goo", () => (u) => engine.setGoo(Math.sin(Math.PI * u), gooStd));
        engine.gz.transition(t).attr("transform", cam.transform);
        // Outlines: every state for the House and the vote-circle views (context for the circles), none for hex tiles
        // (the tiles ARE the states), otherwise just a crisp outline around the state we're zoomed into.
        // They must NOT fade in on their own clock: drawing the final borders over still-morphing shapes reads as a flash.
        // Instead they hold at 0 during the morph and fade in over the last stretch, as the shapes land.
        const tileView = evTo === "hex" || evTo === "tiles";
        const allOutlines = !tileView && (nextMode === "house" || evTo !== "map");
        const outlineTarget = (d) => (tileView ? 0 : allOutlines || d.id === nextScope ? 1 : 0);
        engine.gO.selectAll("path")
          .attr("stroke", tileView ? "#94a3b8" : allOutlines ? THEME.BORDER : "#64748b")
          .attr("stroke-width", tileView ? 0.8 : allOutlines ? 0.8 : 1.4);
        engine.gO.selectAll("path").transition("outline").duration(THEME.MORPH_MS * 0.35).delay(THEME.MORPH_MS * 0.65).ease(easeIO)
          .attr("opacity", outlineTarget);
        engine.gO.raise();

        drawTitle(board, state, t);
        drawBackButton(board, state, t, () => navigate(app, null));
        renderApp(app, THEME.MORPH_MS);
        const circFrom = evFrom === "bubble" || evFrom === "cartogram", circTo = evTo === "bubble" || evTo === "cartogram";
        if (circTo) introBubbles(app, nextUnits, THEME.MORPH_MS);
        else if (circFrom) outroBubbles(app, THEME.MORPH_MS);
        // SAFE: Guard against missing retargetMarkers and renderMarkers
        if (typeof retargetMarkers === "function" && engine.gF) {
          retargetMarkers(engine.gF, state, t);
        } else if (typeof renderMarkers === "function" && typeof markersToShow === "function" && engine.gF) {
          renderMarkers(engine.gF, state, markersToShow(state, summarize(state)));
        }

        await runPlan(engine, plan, THEME.MORPH_MS, THEME.GOO_STD / Math.sqrt(kFrom * cam.k));
        engine.setGoo(0, 1);
        // Stop here: the motion groups already left the settled nodes in their final geometry/fill state.
        // A full repaint after the morph is the hard snap that creates the pop-in effect after transitions.
        // But the navBusy-gated layers (hex labels + state outlines, raised states) were held at 0 during the
        // morph, so fade them in now — directly, without re-transitioning the fills.
        state.navBusy = false;
        renderRaised(app, summarize(state));
        renderLabels(app);
      } finally {
        state.navBusy = false;
        if (state.pendingNav) {
          const [s, m, v] = state.pendingNav;
          state.pendingNav = null;
          navigate(app, s, m, v);
        }
      }
    }

    function switchMode(app, mode) {
      const pend = app.state.pendingNav;
      const base = pend ? pend[0] : app.state.scope;
      return navigate(app, base && !MODEL[mode].byState.has(base) ? null : base, mode, pend ? pend[2] : app.state.view);
    }

    function switchView(app, v) {
      const pend = app.state.pendingNav;
      return navigate(app, pend ? pend[0] : app.state.scope, pend ? pend[1] : app.state.mode, v);
    }

    // ---- controls ----
    function toggleFlips(app) {
      app.state.flipsOnly = !app.state.flipsOnly;
      styleControls(app.controls, app.state);
      renderApp(app);
    }

    function scrub(app, t) {
      app.state.T = t;
      renderApp(app);
    }

    function togglePlay(app) {
      const { state, controls } = app;
      state.playing = !state.playing;
      controls.playBtn.textContent = state.playing ? "❚❚ Pause" : "▶ Play";
      if (!state.playing) {
        state.timer?.stop();
        return;
      }
      if (state.T >= 1) state.T = 0;
      let last = performance.now();
      state.timer = d3.timer(() => {
        const now = performance.now();
        state.T = Math.min(1, state.T + (now - last) / THEME.PLAY_MS);
        last = now;
        if (state.T >= 1) {
          state.playing = false;
          controls.playBtn.textContent = "▶ Replay";
          state.timer.stop();
        }
        renderApp(app);
      });
    }

    // ---- lifecycle ----
    function createApp() {
      const root = createRoot();
      const svg = d3.create("svg")
        .attr("viewBox", [0, 0, THEME.W, THEME.H + THEME.TOP])
        .style("width", "100%")
        .style("background", THEME.BG || "#fff");

      root.append(svg.node());
      const layers = createMapLayers(svg);
      // (the lift layer, created later by the overlay, is inserted just before layer-hover)
      layers.gH = layers.gz.insert("g", "g.layer-markers").attr("class", "layer-hover").attr("pointer-events", "none");
      // this year's states, raised on a shadow: just above the shapes and the motion layer, below the outlines
      layers.gR = layers.gz.insert("g", "g.layer-outlines").attr("class", "layer-raised").attr("pointer-events", "none").attr("opacity", 0);
      // vote-circle discs: under the lift layer
      layers.gB = layers.gz.insert("g", "g.layer-hover").attr("class", "layer-bubbles").attr("pointer-events", "none").attr("opacity", 0);
      // hex-tile labels, then the hover / spotlight layer on the very top
      layers.gL = layers.gz.append("g").attr("class", "layer-labels").attr("pointer-events", "none").attr("opacity", 0);
      layers.gS = layers.gz.append("g").attr("class", "layer-spot").attr("pointer-events", "none");
      layers.gO.raise();
      const board = createBoard(svg);
      const strip = createStrip(root);
      const state = createState();
      const app = { root, svg, state, board, strip, view: { root, tipEl: root.querySelector(".tip"), spotId: null } };
      app.view.spotlight = (feature) => spotlight(app, feature);

      app.engine = {
        ...layers,
        fillOf: (u) => fillFor(state, u),
        bind: (sel) => bindUnitEvents(app, sel),
        nodePool: new Map()
      };

      app.controls = createControls(root, {
        onMode: (m) => switchMode(app, m),
        onView: (v) => { if (viewAvailable(v, app.state.scope, app.state.mode)) switchView(app, v); },
        onFlips: () => toggleFlips(app),
        onPlay: () => togglePlay(app),
        onScrub: (t) => scrub(app, t)
      });

      layers.bg.on("click", () => state.scope && navigate(app, null));
      return app;
    }

    /** First paint (no animation), then background cache warming. */
    function startApp(app) {
      const { state, engine, svg, board, controls } = app;
      styleControls(controls, state);
      for (const u of [...stateUnits, ...districtUnits]) {
        makeNode(engine, u, { d: u.d, fill: engine.fillOf(u), opacity: 0 });
      }
      drawTitle(board, state, svg.transition().duration(0));
      runPlan(engine, planUnits(engine, unitsFor(state.mode, state.scope, state.view)), 0, THEME.GOO_STD);
      renderApp(app, 0);
      if (typeof warmCaches === "function") {
        warmCaches([...stateUnits, ...districtUnits], () => state.stopped);
      }
    }

    function stopApp(app) {
      app.state.stopped = true;
      app.state.timer?.stop();
    }
  </script>

  <script id="57" type="text/markdown">
    ## Design rules (read before changing anything in this notebook)

    These are standing rules for any future edits, whether by a person or an assistant.

    1. **Nothing randomly appears or disappears; things transition between states.**
       Shapes morph, fade, slide or grow from where they were. Numbers, bars, pills, markers, titles and buttons ease into place. They don't pop in or out, and they don't jump. The existing flubber morph engine is the approved look, so don't replace it with plain cross-fades.
       While shapes are morphing, the status overlay (lifted shapes, stripes) is hidden once and faded back in once when they land. It never flashes on top of moving shapes.
    2. **Show, don't tell.**
       Prefer a visual encoding (position, colour, a gauge, an arrow, a bar, elevation, a hatch) to a sentence or label. Add text only when the picture can't carry the meaning by itself. Anything that needs explaining gets a tiny visual key, not a paragraph.
    3. **Colours must never be confusing.**
       Each party gets one colour, used the same way everywhere (map, bars, pills, tooltips, badges):
       - **Democrat = blue**
       - **Republican = red**
       - **Independent = yellow/amber**
       - Unreported = neutral grey. Warning accents must not reuse a party colour.
       Define colours once in `THEME` and don't hard-code new ones. Darker or paler shades are derived from the party colour.
    4. **Everything is connected.**
       If you select, hover or click a race in one place (map, margin strip, scoreboard, tooltip), the same race should be highlighted or revealed in every other place. Hovering a pill darkens the rest of the map, drops the other pills back, and draws where that race was before (last election, else forecast) on the strip axis. Clicking a state zooms the map and the strip, and so on. Any new view must plug into this shared selection and hover state.
    5. **Keep the structure.**
       Theme, geo, units, race data, model, calling, fills, tooltip, strip, board, morph engine, controls and app each live in their own cell. Change the cell responsible for the behaviour and leave the others alone.
    6. **Ask before replacing something the user has approved.**
       If a change might alter a look or behaviour the user has said they like, make it additive or ask first.
    7. **Certainty is physical: a race in play is raised, a called race is settled.**
       - **In play** (has votes, not called) = a pale tint of the leader, **lifted off the page** with a soft shadow. The colour is never as strong as a called race.
       - **Called** = the lift is released: the shape settles back flat, in the **full hard party colour**. Calling is a pure function of the count (see the CALLING cell).
       - **Flip** = diagonal stripes in the NEW leader's colour alternating with white (blue and white stripes means flipped to D).
       - No icons, badges or outlines on top of the map. Status marks must not hide the shapes underneath. The overlay lives in the "MAP STATUS OVERLAY" cell, its key shows live counts, and the tooltip chips use the same marks in miniature.
       - Strength of colour always means certainty. Counties (areas, not races) keep the plain margin gradient.
       - States with no race this year are muted toward grey so they recede behind the live contests.

    8. **Candidates, polls and ratings come from `electionData`.**
       The RACE DATA cell reads nominee names, polling averages and forecaster ratings. The MODEL cell only falls back to hand-entered values where the data has none.
  </script>
